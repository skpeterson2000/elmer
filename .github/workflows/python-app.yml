# Lint, then run the tests the way this repository actually runs them.
#
# The starter workflow this began as ended with a bare `pytest`, and that was
# failing every push while every test passed. ELMER's tests are standalone
# scripts: each one prints the checks it made in the order it made them, and
# exits non-zero if any of them failed. There are no test_* functions for
# pytest to collect, so it collected none and exited 5 - "no tests ran" - which
# is a failure. The build went red on green tests, every time.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # v7 and v7 both target Node 24. On v4/v5 GitHub forced them onto 24
    # anyway and annotated every run to say so, which is noise on a green
    # build and teaches people to stop reading the annotations.
    - uses: actions/checkout@v7
    # The version the units in the field actually run: Raspberry Pi OS
    # bookworm ships 3.11, and testing anything else tests somebody else's
    # install.
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    # The library reads manuals with poppler, as --build reads the pools;
    # without it the library test skips and says so, which is not a test.
    - name: Install poppler
      run: sudo apt-get install -y --no-install-recommends poppler-utils
    # Several tests load a page in a real browser, because a page's inline
    # script either runs or it does not and nothing short of a JavaScript
    # engine can say which (see tests/_browser.py). They fail - not skip -
    # without one, on purpose: a test that skips when its tool is missing is
    # a test that never runs where it matters. The runner used to ship Google
    # Chrome and the tests leaned on that; when the image dropped it the build
    # went red on green code. So the browser is installed here rather than
    # assumed, the same way poppler is.
    - name: Install Chromium for the browser tests
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends chromium-browser || true
        # Ubuntu's apt "chromium-browser" is a snap stub that tests reject, so
        # fall back to Google Chrome's own package, which puts a real browser
        # on PATH as google-chrome-stable.
        if ! chromium --version >/dev/null 2>&1 && ! chromium-browser --version >/dev/null 2>&1; then
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run the tests
      run: |
        # Every one of them, and the whole list even if an early one fails -
        # "three of these broke" is worth more than "the first one broke".
        # A failing test is also an annotation on the run, with the FAIL
        # lines it printed: the annotations can be read from the API
        # without a login, the job log cannot, and "which test, which
        # check" is the whole of what a red build needs to say.
        failed=""
        for t in tests/test_*.py; do
          echo "::group::$t"
          rc=0
          out=$(python "$t" 2>&1) || rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            failed="$failed $t"
            why=$(echo "$out" | grep -E "FAIL|Traceback|Error|BREACH|    (open|sqlite3|os.|shutil)" | head -8 | paste -sd '|' -)
            echo "::error file=$t::$t failed (rc $rc): ${why:0:900}"
          fi
          echo "::endgroup::"
        done
        if [ -n "$failed" ]; then
          echo "failed:$failed"
          exit 1
        fi
        echo "all test files passed"

  # The Pi is what ELMER is for, and the job above stands in for it. This one
  # exists because Windows is a second implementation in the few places that
  # cannot be shared - stopping the program, naming a serial port, telling
  # somebody how to watch the log, replacing a file another thread has open -
  # and an untested second implementation works right up until somebody
  # needs it.
  #
  # It installs the way the README tells a person to, through install.ps1,
  # rather than pip-installing behind the installer's back, because "it will
  # not install on Windows" is one of the reports this is here to catch. Then
  # it lints and runs every test the way the job above does, through the
  # virtual environment the installer made.
  windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    # The Python the portable zip carries (see release.yml). The Pi's 3.11
    # is pinned above for a reason that does not apply here: nobody runs
    # Raspberry Pi OS on the laptop this job stands in for.
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # poppler, for the library and the NIFOG reader, as the job above
    # installs it. install.ps1 offers it through winget, and only with a
    # keyboard or -Yes; a runner has neither a keyboard nor winget.
    - name: Install poppler
      run: choco install poppler -y --no-progress
    # The installer finds Python through the py launcher, which on a runner
    # with several Pythons picks the newest; these tell it which one is meant.
    - name: Install, exactly as a person would
      env:
        PY_PYTHON: "3.12"
        PY_PYTHON3: "3.12"
      run: powershell -ExecutionPolicy Bypass -File install.ps1
    # Which interpreter the installer actually chose, said in the log and
    # held: a surprise here should stop the job, not be inferred later from
    # a strange failure three tests in.
    - name: Say what the installer built
      shell: bash
      run: |
        .venv/Scripts/python.exe -VV
        .venv/Scripts/python.exe -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 'the installer built with ' + sys.version)"
    # Here the virtual environment is inside the checkout, as it is on every
    # installed Windows unit, which is what .flake8's excludes are for.
    - name: Lint with flake8
      shell: bash
      run: |
        .venv/Scripts/python.exe -m pip install --quiet flake8
        .venv/Scripts/python.exe -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Run the tests
      shell: bash
      run: |
        # The same loop as the job above, through the installer's Python, so
        # this tests the installed program and not a separate set of packages.
        failed=""
        for t in tests/test_*.py; do
          echo "::group::$t"
          rc=0
          out=$(.venv/Scripts/python.exe "$t" 2>&1) || rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            failed="$failed $t"
            why=$(echo "$out" | grep -E "FAIL|Traceback|Error|BREACH|    (open|sqlite3|os.|shutil)" | head -8 | paste -sd '|' -)
            echo "::error file=$t::$t failed on Windows (rc $rc): ${why:0:900}"
          fi
          echo "::endgroup::"
        done
        if [ -n "$failed" ]; then
          echo "failed:$failed"
          exit 1
        fi
        echo "all test files passed"
