<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big board &middot; ELMER</title>
<link rel="stylesheet" href="{{ asset('elmer.css') }}">
<style>
/* Read from the back of a hall, by people holding a paper plate. Everything
   here is sized for distance: few things on screen, all of them large. */
body { margin: 0; background: var(--bg); color: var(--text);
       font-family: var(--sans); overflow: hidden; }
.board { height: 100dvh; display: flex; flex-direction: column;
         /* The foot leaves room for the two corner hints, which are fixed and
            would otherwise sit on the last row of whatever is beneath them. */
         padding: 1.4vh 1.6vw 2.6vh; }
/* The stage takes what the head leaves, so the panels inside it - and the
   wall of tournaments - fill the screen rather than huddling at the top. */
#stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.head { display: flex; align-items: baseline; gap: 1.2vw; margin-bottom: 1.2vh; }
.head h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2.6rem); letter-spacing: .01em; }
.head .sub { color: var(--dim); font-size: clamp(.8rem, 1.3vw, 1.2rem); }
.head .clock { margin-left: auto; font-family: var(--mono);
               font-size: clamp(1.6rem, 5vw, 4.5rem); color: var(--amber);
               font-variant-numeric: tabular-nums; line-height: 1; }
.head .clock.done { color: var(--dim); }

/* The question and the result share one reserved area, and it keeps its
   height whether or not there is anything in it. A short question then leaves
   dead space rather than letting the scoreboards below grow into it - because
   the moment a block result appears they would have to give it back, and a
   leaderboard that loses a row every twelfth question, and gains it again ten
   seconds later, reads as a screen that cannot make its mind up.

   Sized to the tallest thing that goes here: the tag, a two line question
   (the reveal clamps it at two), the answer, and a block declaration under
   it. Anything taller than that still grows - a question with a figure - and
   the panels give way for it, which is the right way round for the rare case.
*/
.question, .reveal { min-height: 22vh; box-sizing: border-box; }

.question { background: var(--panel); border: 1px solid var(--line);
            border-radius: 14px; padding: 1.6vh 1.6vw; margin-bottom: 1.4vh; }
.question .tag { color: var(--dim); font-family: var(--mono);
                 font-size: clamp(.7rem, 1.1vw, 1rem); }
.question p { margin: .4vh 0 0; font-size: clamp(1.1rem, 2.4vw, 2.2rem);
              line-height: 1.35; }

.cols { flex: 1; display: grid; grid-template-columns: 1.15fr 1fr;
        gap: 1.4vw; min-height: 0; }
.panelbox { background: var(--panel); border: 1px solid var(--line);
            border-radius: 14px; padding: 1.2vh 1.2vw; overflow: hidden;
            display: flex; flex-direction: column; }
.panelbox h2 { margin: 0 0 .8vh; font-size: clamp(.85rem, 1.4vw, 1.3rem);
               color: var(--dim); font-weight: 600; letter-spacing: .04em;
               text-transform: uppercase; }
table { width: 100%; border-collapse: collapse; }
td { padding: .55vh .4vw; border-bottom: 1px solid var(--line);
     font-size: clamp(.85rem, 1.5vw, 1.5rem); }
td.pos { color: var(--dim); width: 2.6ch; font-family: var(--mono); }
td.pts, td.ms { text-align: right; font-family: var(--mono); }
td.ms { color: var(--dim); }
tr.lead td { color: var(--amber); font-weight: 700; }
tr.gold td { color: #ffd479; }
/* The practice tables and players are not marked on this screen.  A board
   with four names on it reads as an evening; the same board with three of
   them struck through as machines reads as an empty room being flattered,
   and the room is what the screen at the front is for.  Which seats are
   going is told by the seat counts, and a person who joins takes one
   whether or not the board ever said so.

   The flag itself is kept everywhere behind this - the host's own panel
   shows it, displacement depends on it, and a name somebody adopts has to
   come from somewhere. */
.tally { display: flex; gap: 1vw; margin-bottom: 1.2vh; }
.tally div { flex: 1; background: var(--panel-2); border-radius: 12px;
             padding: .9vh 1vw; }
.tally b { display: block; font-family: var(--mono);
           font-size: clamp(1.2rem, 3vw, 2.6rem); line-height: 1.1; }
.tally span { color: var(--dim); font-size: clamp(.65rem, 1vw, .95rem);
              text-transform: uppercase; letter-spacing: .05em; }
.waiting { text-align: center; color: var(--dim); padding: 6vh 2vw;
           font-size: clamp(1rem, 2vw, 1.8rem); }
.picker { margin-top: 1vh; text-align: center; color: var(--amber);
          font-size: clamp(.9rem, 1.7vw, 1.6rem); }
.idle { display: flex; flex-direction: column; align-items: center;
        justify-content: center; flex: 1; text-align: center; gap: 1.4vh; }
.idle h2 { margin: 0; font-size: clamp(1.4rem, 4vw, 3rem); }
.idle p { margin: 0; color: var(--dim); font-size: clamp(.9rem, 1.8vw, 1.6rem);
          max-width: 40ch; line-height: 1.5; }
.idle .addr { font-family: var(--mono); color: var(--amber);
              font-size: clamp(1rem, 2.4vw, 2rem); }
/* Several tournaments at once. One card each, sized so four fit a hall
   screen and one fills a laptop; a card is a button, because the obvious
   thing to do with a tournament on a wall is to look closer at it. */
.games { flex: 1; display: grid; gap: 1.2vh 1.2vw; min-height: 0;
         grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr));
         grid-auto-rows: min-content; align-content: start; overflow: auto; }
.game { background: var(--panel); border: 1px solid var(--line);
        border-radius: 14px; padding: 1.1vh 1.1vw; text-align: left;
        color: inherit; cursor: pointer; overflow: hidden;
        display: flex; flex-direction: column; }
.game:focus-visible { outline: 2px solid var(--amber); }
.game:hover { border-color: var(--amber); }
.game.here { border-color: var(--green); }
.game .top { display: flex; align-items: baseline; gap: .6vw; }
.game h3 { margin: 0; font-size: clamp(1rem, 1.8vw, 1.7rem); }
.game .when { margin-left: auto; font-family: var(--mono); color: var(--amber);
              font-size: clamp(1rem, 2vw, 1.8rem); font-variant-numeric: tabular-nums; }
.game .when.done { color: var(--dim); }
.game .who { color: var(--dim); font-size: clamp(.7rem, 1.1vw, 1rem);
             margin: .3vh 0 .6vh; }
.game .q { font-size: clamp(.8rem, 1.3vw, 1.15rem); line-height: 1.35;
           color: var(--text); margin: 0 0 .6vh;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
           overflow: hidden; }
.game table { margin-top: .2vh; }
.game td { padding: .35vh .3vw; font-size: clamp(.75rem, 1.2vw, 1.15rem); }
.game .addr { font-family: var(--mono); color: var(--dimmer);
              font-size: clamp(.65rem, 1vw, .9rem); margin-bottom: .5vh; }
.game .flag { font-size: clamp(.65rem, 1vw, .9rem); font-family: var(--mono);
              color: var(--dimmer); }
.game .flag.bad { color: var(--red); }
.head .btn { font-family: var(--sans); font-size: clamp(.7rem, 1.1vw, 1rem);
             background: var(--panel-2); color: var(--dim); cursor: pointer;
             border: 1px solid var(--line); border-radius: 999px;
             padding: .3vh .8vw; }
.head .btn:hover { color: var(--text); border-color: var(--amber); }
/* The reveal. A hall that has just read a question is a hall that will read
   the answer to it, and this is the only moment anybody is looking. One line,
   no explanation, no other choices - surface familiarity, which is how most
   of this material is first met anyway. */
.reveal { background: var(--panel); border: 1px solid var(--line);
          border-radius: 14px; padding: 1.2vh 1.6vw; margin-bottom: 1.2vh; }
.reveal .tag { color: var(--dim); font-family: var(--mono);
               font-size: clamp(.7rem, 1.1vw, 1rem); }
.reveal .q { margin: .3vh 0 .8vh; color: var(--dim);
             font-size: clamp(.85rem, 1.6vw, 1.4rem); line-height: 1.3;
             display: -webkit-box; -webkit-line-clamp: 2;
             -webkit-box-orient: vertical; overflow: hidden; }
.reveal .a { display: flex; align-items: baseline; gap: .8vw; }
.reveal .a b { color: var(--dim); font-size: clamp(.7rem, 1.1vw, 1rem);
               text-transform: uppercase; letter-spacing: .06em; }
.reveal .a span { color: var(--green); font-weight: 700;
                  font-size: clamp(1rem, 2.2vw, 2rem); line-height: 1.25; }

/* The foot of the board: this table on the left, the hall on the right. A
   spectator standing at table three can see their own people climbing and
   where the table stands among the rest, which between rounds is the only
   thing on the screen anybody is actually following. */
.foot { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vw;
        margin-top: 1.2vh; }
.foot.one { grid-template-columns: 1fr; }
.foot .box { background: var(--panel); border: 1px solid var(--line);
             border-radius: 12px; padding: .8vh 1vw; overflow: hidden; }
.foot h2 { margin: 0 0 .5vh; font-size: clamp(.7rem, 1.1vw, 1rem);
           color: var(--dim); font-weight: 600; letter-spacing: .04em;
           text-transform: uppercase; display: flex; gap: .6vw;
           align-items: baseline; }
.foot h2 em { font-style: normal; color: var(--dimmer); font-weight: 400;
              letter-spacing: 0; text-transform: none; }
.foot ol { list-style: none; margin: 0; padding: 0; display: flex;
           flex-wrap: wrap; gap: .3vh 1.2vw; }
/* Room at the end for the close hint, which is fixed to that corner and was
   sitting on top of the last table's score. */
.foot .box:last-child ol { padding-right: 9rem; }
.foot li { display: flex; align-items: baseline; gap: .45vw;
           font-size: clamp(.8rem, 1.4vw, 1.35rem); }
.foot li .pos { color: var(--dimmer); font-family: var(--mono); }
.foot li .pts { font-family: var(--mono); font-weight: 700; }
.foot li .up { color: var(--green); font-family: var(--mono);
               font-size: clamp(.65rem, 1vw, .95rem); }
.foot li.bot { color: var(--dim); }
.foot li.lead .pts { color: var(--amber); }
/* The left column of a hall carries two answers - which table is winning and
   which person is - so it stacks. The tables box is given its content and the
   players box takes the rest, because there are always fewer tables. */
/* Both boxes take half the column each, by basis 0 rather than by content.
   Sized from their content they would depend on how many rows were showing,
   and the trimming below depends on how tall the box is - which is a loop
   that eats itself: hide a row, the box shrinks, another row no longer fits.
   Half and half is predictable, and there are always fewer tables than
   players so the tables box has room to spare rather than the other way. */
.stack { display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; }
.stack .panelbox { flex: 1 1 0; min-height: 0; }

/* Practice is marked, never hidden by default: a name in italics beside a
   real one is the honest way to show a hall that is half made up. */
i.sim { font-style: italic; color: var(--dimmer); font-size: .78em; }
td.word { font-family: var(--mono); letter-spacing: .18em; font-weight: 700; }
td.word i { font-style: normal; color: var(--line-2); }
tr.outrow td { opacity: .5; }
tr.outrow td.word { color: var(--red); opacity: .8; }
.pickmark { color: var(--amber); font-size: .7em; font-family: var(--mono); margin-left: .4em; }

/* A block result is the biggest thing on the screen for ten seconds, because
   it is the only moment in twelve questions when somebody has won something. */
.block-won { margin-top: 1vh; padding: .8vh 1.2vw; border-radius: 10px;
             background: var(--panel-2); border: 1px solid var(--amber-dim);
             display: flex; align-items: baseline; gap: 1vw; }
.block-won b { color: var(--amber); font-size: clamp(.9rem, 1.6vw, 1.5rem); }
.block-won span { font-size: clamp(.85rem, 1.5vw, 1.4rem); }

.practicehint { position: fixed; left: .8vw; bottom: .6vh; color: var(--dimmer);
                font-size: clamp(.6rem, 1vw, .9rem); font-family: var(--mono);
                opacity: .55; cursor: pointer; }
.practicehint.off { color: var(--amber); opacity: .9; }

.closehint { position: fixed; right: .8vw; bottom: .6vh; color: var(--dimmer);
             font-size: clamp(.6rem, 1vw, .9rem); font-family: var(--mono);
             opacity: .55; }
.closehint.armed { color: var(--amber); opacity: 1; }
</style>
</head>
<body>
<div class="board">
  <div class="head">
    <h1 id="title">ELMER</h1>
    <span class="sub" id="sub"></span>
    <button class="btn" id="showall" hidden>&larr; All tournaments</button>
    <span class="clock" id="clock">—</span>
  </div>
  <div id="stage"><div class="waiting">Waiting for net control…</div></div>
  <div id="foot" class="foot" hidden></div>
</div>

<script>
const stage = document.getElementById('stage');
let paintedRound = null, paintedPhase = null;

function esc(s) { const d = document.createElement('div');
                  d.textContent = s == null ? '' : s; return d.innerHTML; }

/* Drop the rows that do not fit, rather than showing half of one.

   How much room the panels get changes: a long question takes three lines
   where a short one takes two, and every twelfth question a block result
   appears above them and pushes everything down. Picking a row count by hand
   means guessing the worst case and showing too little the rest of the time,
   or guessing the usual case and slicing somebody's name in half when a block
   closes. So the rows are measured once they are on the screen and the ones
   hanging off the bottom are taken out.

   Measured before anything is hidden, in one pass: hiding a row only moves
   the rows below it, which are the ones already going. */
function trimToFit() {
  document.querySelectorAll('.panelbox').forEach(box => {
    const rows = [...box.querySelectorAll('tr')];
    rows.forEach(row => { row.hidden = false; });
    const floor = box.getBoundingClientRect().bottom;
    const over = rows.filter(row => row.getBoundingClientRect().bottom > floor);
    over.forEach(row => { row.hidden = true; });
  });
}

/* Practice tables and practice players count, and the board says so, because
   a board with them edited out is not the game that was played. But a club
   night with three real tables among six wants to see the three, so it is a
   switch on the screen rather than a decision taken for the room - and it is
   a switch on the *view*: net control's "send one home" takes a practice
   table out of the game, which is a different thing entirely. */
let countPractice = recallFlag('board.practice', true);

function recallFlag(key, fallback) {
  try {
    const got = localStorage.getItem(key);
    return got === null ? fallback : got === '1';
  } catch (e) { return fallback; }   // private window, or storage refused
}

function realOnly(rows, isBot) {
  return countPractice ? rows : rows.filter(r => !isBot(r));
}

/* Practice is marked row by row only when there is a real one to tell it
   apart from. A hall that is all practice - a bench, a demonstration, an
   instructor setting up before anybody arrives - says so once in the heading
   instead of stamping every line, which at ten feet is just noise. */
function practiceNote(rows, isBot) {
  if (!countPractice || !rows.length) return {each: false, all: false};
  const bots = rows.filter(isBot).length;
  return {each: bots > 0 && bots < rows.length, all: bots === rows.length};
}

function standings(board) {
  const sh = board.shootout;
  if (sh && sh.on) return shootoutTables(board, sh);
  const units = realOnly(board.units || [], u => u.simulated);
  const mark = practiceNote(units, u => u.simulated);
  const rows = units.slice(0, 5).map((u, i) => `
    <tr class="${i === 0 && u.score > 0 ? 'gold' : ''}">
      <td class="pos">${i + 1}</td>
      <td>${esc(u.name)}${mark.each && u.simulated ? ' <i class="sim">practice</i>' : ''}${
        u.present ? '' : ' <span style="color:var(--dimmer)">(quiet)</span>'}</td>
      <td class="ms">${u.players}</td>
      <td class="pts">${u.score}</td>
    </tr>`).join('');
  return `<div class="panelbox"><h2>Tables &mdash; overall` +
    (mark.all ? ' <i class="sim">all practice</i>' : '') + `</h2>` +
    (rows ? `<table>${rows}</table>`
          : `<div class="waiting">No tables but the practice ones</div>`) +
    `</div>`;
}

/* The hall's running total by person, which is the number somebody sitting at
   a table is actually playing for. The tables' own totals answer a different
   question - which table is winning - and a round board answers a third, which
   is who was quickest just now. All three were worth a panel; only two of them
   were on the screen. */
function overall(board) {
  const people = realOnly(board.people || [], p => p.bot);
  const mark = practiceNote(people, p => p.bot);
  const rows = people.slice(0, 5).map((p, i) => `
    <tr class="${i === 0 && p.score > 0 ? 'gold' : ''}">
      <td class="pos">${i + 1}</td>
      <td>${esc(p.name)}${mark.each && p.bot ? ' <i class="sim">practice</i>' : ''}</td>
      <td class="ms">${esc(p.unit_name || '')}</td>
      <td class="ms">${p.correct}/${p.answered}</td>
      <td class="pts">${p.score}</td>
    </tr>`).join('');
  return `<div class="panelbox"><h2>Players &mdash; top 5 overall` +
    (mark.all ? ' <i class="sim">all practice</i>' : '') + `</h2>` +
    (rows ? `<table>${rows}</table>`
          : `<div class="waiting">${(board.people || []).length
               ? 'Only practice players so far'
               : 'Nobody has answered yet'}</div>`) +
    `</div>`;
}

/* A hall shootout: the tables and their letters. Still in, then out, and
   the table holding the pick marked. The word is the score. */
function shootoutTables(board, sh) {
  const rows = realOnly(sh.standing || [], r => r.simulated);
  const mark = practiceNote(rows, r => r.simulated);
  const line = rows.slice(0, 8).map((r, i) => `
    <tr class="${r.picking && !sh.over ? 'lead' : ''} ${r.out ? 'outrow' : ''}">
      <td class="pos">${i + 1}</td>
      <td>${esc(r.name)}${mark.each && r.simulated ? ' <i class="sim">practice</i>' : ''}${
        r.picking && !sh.over ? ' <span class="pickmark">picking</span>' : ''}</td>
      <td class="pts word">${esc(r.word)}<i>${'ELMER'.slice((r.word || '').length)}</i></td>
    </tr>`).join('');
  return `<div class="panelbox"><h2>Tables &mdash; shootout` +
    (mark.all ? ' <i class="sim">all practice</i>' : '') + `</h2>` +
    (line ? `<table>${line}</table>` : `<div class="waiting">No tables but the practice ones</div>`) +
    `</div>`;
}

function hallLeft(board) {
  return `<div class="stack">${standings(board)}${overall(board)}</div>`;
}

function lastRound(board) {
  const last = board.last;
  if (!last) return `<div class="panelbox"><h2>Last round</h2>
      <div class="waiting">No rounds yet</div></div>`;
  // Five, not eight. Five is a podium with room on it; eight is a list, and
  // the whole point of a board is that a name on it means something.
  const top = (last.top || []).slice(0, 5).map((r, i) => `
    <tr class="${i === 0 ? 'lead' : ''}">
      <td class="pos">${r.place}</td>
      <td>${esc(r.name)}</td>
      <td class="ms">${esc(r.unit_name)}</td>
      <td class="ms">${(r.ms / 1000).toFixed(2)}s</td>
    </tr>`).join('');
  return `<div class="panelbox">
      <h2>Round ${last.number} &mdash; top 5</h2>
      <div class="tally">
        <div><b>${last.correct}</b><span>correct</span></div>
        <div><b>${last.answers}</b><span>answers</span></div>
        <div><b>${last.units_reported}</b><span>tables in</span></div>
      </div>
      <table>${top}</table>
      ${last.winner_unit && !(board.shootout && board.shootout.on)
        ? `<div class="picker">${esc(last.winner_name || last.winner_unit)} takes the round</div>` : ''}
    </div>`;
}

function players(board) {
  /* One table's own leaderboard - the view for a club night rather than a
     hall, so somebody's family can watch them climb it. */
  const all = [];
  (board.cohorts || []).forEach(c => (c.members || []).forEach(m => all.push(m)));
  const shown = realOnly(all, m => m.bot);
  shown.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  const rows = shown.slice(0, 12).map((m, i) => `
    <tr class="${i === 0 && m.score > 0 ? 'gold' : ''}">
      <td class="pos">${i + 1}</td>
      <td>${esc(m.name)}${m.bot ? ' <i class="sim">practice</i>' : ''}</td>
      <td class="ms">${m.correct}/${m.answered}</td>
      <td class="pts">${m.score}</td>
    </tr>`).join('');
  return `<div class="panelbox"><h2>Players &mdash; overall</h2>` +
    (rows ? `<table>${rows}</table>`
          : `<div class="waiting">${all.length ? 'Only practice players so far'
                                              : 'Nobody has answered yet'}</div>`) +
    `</div>`;
}

function tableRound(board) {
  const r = board.round;
  if (!r || !r.closed) {
    const c = (board.cohorts || []).map(x => `
      <tr><td class="pos"></td><td>${esc(x.name)}</td>
          <td class="ms">${x.players}</td><td class="pts">${x.score}</td></tr>`).join('');
    return `<div class="panelbox"><h2>Cohorts</h2><table>${c}</table></div>`;
  }
  const res = (r.results || []).slice(0, 10).map(a => `
    <tr class="${a.place === 1 ? 'lead' : ''}">
      <td class="pos">${a.place || '–'}</td>
      <td>${esc(a.name)} ${a.correct ? '✓' : '✗'}</td>
      <td class="ms">${(a.ms / 1000).toFixed(2)}s</td>
      <td class="pts">${a.points || 0}</td>
    </tr>`).join('');
  const right = (r.results || []).filter(a => a.correct).length;
  return `<div class="panelbox">
      <h2>Round ${r.number} &mdash; fastest correct</h2>
      <div class="tally">
        <div><b>${right}</b><span>correct</span></div>
        <div><b>${(r.results || []).length}</b><span>answered</span></div>
      </div>
      <table>${res}</table>
      ${r.winner_cohort ? `<div class="picker">Cohort ${r.winner_cohort} takes the round</div>` : ''}
    </div>`;
}

function idle(board) {
  return `<div class="idle">
      <h2>No tournament running</h2>
      <p>Start one from a license class on the dashboard, or open net control
         to run a hall of tables.</p>
      <p class="addr">${esc(board.where || '')}</p>
    </div>`;
}

/* ------------------------------------------------- the wall of tournaments */
/* A hall can hold several at once, and a board that could only show the one
   running on the Pi it happens to be plugged into was showing the wrong thing:
   the screen at the front of a room should show the room. So every game this
   unit can hear gets a card, and a card can be opened into the full board.
   With one game running there is nothing to choose between, and the wall is
   skipped entirely. */

let focused = new URLSearchParams(location.search).get('net');
if (focused === null) focused = undefined;   // undefined: nothing chosen yet

function leaders(game) {
  /* The top of whatever this game counts - tables in a hall, players at a
     lone table. Five, because from the back of a room a card is read at a
     glance and a full leaderboard is what opening one is for. */
  const b = game.board || {};
  if (game.kind === 'hall') {
    return (b.units || []).slice(0, 5)
      .map(u => [u.name, u.score, u.players + 'p', u.simulated]);
  }
  const all = [];
  (b.cohorts || []).forEach(c => (c.members || []).forEach(m => all.push(m)));
  all.sort((a, b2) => b2.score - a.score || a.name.localeCompare(b2.name));
  return all.slice(0, 5)
    .map(m => [m.name, m.score, m.correct + '/' + m.answered, !!m.bot]);
}

function gameCard(game) {
  const b = game.board || {};
  const round = b.round;
  const open = round && !round.closed;
  const left = !round ? null
    : (game.kind === 'hall' ? Math.max(0, (round.seconds || 0) - (round.elapsed || 0))
                            : (round.remaining || 0));
  const who = game.kind === 'hall'
    ? `${b.units_present || 0} table${b.units_present === 1 ? '' : 's'} · ` +
      `${b.players || 0} player${b.players === 1 ? '' : 's'}`
    : `${b.people || 0} player${b.people === 1 ? '' : 's'}` +
      (b.bots ? ` · ${b.bots} practice` : '');
  const rows = leaders(game).map(([name, score, extra], i) => `
    <tr class="${i === 0 && score > 0 ? 'gold' : ''}">
      <td class="pos">${i + 1}</td><td>${esc(name)}</td>
      <td class="ms">${esc(extra)}</td><td class="pts">${score}</td></tr>`).join('');
  const q = (round && round.question) || {};
  const flag = game.error && !game.board
      ? '<span class="flag bad">not answering</span>'
      : game.stale ? '<span class="flag bad">quiet for ' + Math.round(game.age_s) + 's</span>'
      : game.here ? '<span class="flag">on this unit</span>' : '';
  // A div rather than a button: a card holds a table of standings, and a
  // table inside a button is not something a browser is obliged to draw.
  return `<div class="game ${game.here ? 'here' : ''}" role="button" tabindex="0"
       data-open="${esc(game.url)}">
      <div class="top">
        <h3>${esc(game.name || 'Tournament')}</h3>
        <span class="when ${open ? '' : 'done'}">${
          left === null ? '—' : (open ? Math.ceil(left) + 's' : 'scored')}</span>
      </div>
      <div class="who">${who}${round ? ' · round ' + round.number : ''} ${flag}</div>
      ${game.url ? `<div class="addr">${esc(game.url.replace(/^https?:\/\//, ''))}</div>` : ''}
      ${open && q.text ? `<p class="q">${esc(q.text)}</p>` : ''}
      <table>${rows}</table>
    </div>`;
}

function wall(games) {
  return `<div class="games">${games.map(gameCard).join('')}</div>`;
}

stage.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('[data-open]');
  if (card) { e.preventDefault(); card.click(); }
});

stage.addEventListener('click', e => {
  const card = e.target.closest('[data-open]');
  if (!card) return;
  focused = card.getAttribute('data-open');
  paintedPhase = null;
  tick();
});
document.getElementById('showall').addEventListener('click', () => {
  focused = null;                    // null: the wall, deliberately
  paintedPhase = null;
  tick();
});

/* ------------------------------------------------- the foot of the board */
/* Two scoreboards, because at a hamfest there are two races going on and a
   spectator is following both: the people at this table, and the tables in the
   hall. A board on a table unit could otherwise only ever show its own eight
   players, which is the half a visitor already knows. */

function footList(rows) {
  return rows.map((r, i) => `
    <li class="${r.bot ? 'bot' : ''} ${i === 0 && r.score > 0 ? 'lead' : ''}">
      <span class="pos">${i + 1}</span>
      <span>${esc(r.name)}</span>
      <span class="pts">${r.score}</span>
      ${r.gained ? `<span class="up">+${r.gained}</span>` : ''}
    </li>`).join('');
}

function footBox(block, sub) {
  return `<div class="box"><h2>${esc(block.name)}<em>${esc(sub)}</em></h2>
    <ol>${footList(block.standings || [])}</ol></div>`;
}

function foot(all) {
  const box = document.getElementById('foot');
  if (!box) return;
  const local = all.local, party = all.party;
  const boxes = [];
  if (local) {
    const who = local.people + (local.people === 1 ? ' player' : ' players') +
      (local.bots ? ` · ${local.bots} practice` : '');
    boxes.push(footBox(local, who));
  }
  if (party && (party.standings || []).length) {
    boxes.push(footBox(party, `${party.units} table${party.units === 1 ? '' : 's'} · ` +
                              `${party.players} player${party.players === 1 ? '' : 's'}`));
  }
  box.className = 'foot' + (boxes.length === 1 ? ' one' : '');
  box.innerHTML = boxes.join('');
  box.hidden = !boxes.length;
}

/* What the answer was. Shown when the round is scored and the winner goes up,
   which is the one moment the whole room is looking at the screen. */
function reveal(round, last) {
  const answer = (round && round.closed && round.answer) || (last && last.answer);
  if (!answer) return '';
  const q = (round && round.question) || {};
  const text = q.text || (last && last.question) || '';
  const number = (round && round.number) || (last && last.number) || '';
  /* Every twelfth question closes a block and declares somebody. It goes
     here, with the answer, because this is the moment the room is already
     looking at the screen - and it names the player as well as the table,
     since the table result is the hall's and the player result is the one
     somebody at a table came for. */
  const won = last && last.block_won;
  const player = won && won.player;
  const shot = last && last.shootout;
  const shotLine = shot ? (shot.made
      ? (shot.took && shot.took.length ? `${(shot.took_names || shot.took).length} table${(shot.took_names || shot.took).length === 1 ? '' : 's'} took a letter`
                                        : 'made, and every table matched it')
      : 'missed, so no table takes a letter') : '';
  return `<div class="reveal">
      <div class="tag">Round ${number} · the answer</div>
      ${text ? `<p class="q">${esc(text)}</p>` : ''}
      <div class="a"><b>Answer</b><span>${esc(answer)}</span></div>
      ${shot ? `<div class="block-won"><b>${shot.made ? 'Made' : 'Missed'}</b><span>${esc(shotLine)}${
          shot.over ? (shot.winner ? ' · the shootout is over' : ' · a draw') : ''}</span></div>` : ''}
      ${won ? `<div class="block-won">
          <b>Block ${won.block}</b>
          <span>${won.name ? esc(won.name) + ' takes it' : 'nobody scored'}${
            player && player.points ? ` · best player ${esc(player.name)}${
              player.unit_name ? ' of ' + esc(player.unit_name) : ''}` : ''}</span>
        </div>` : ''}
    </div>`;
}

async function tick() {
  let games, all = {}, known = 0, where = '';
  try {
    const r = await fetch('/api/boards');
    if (!r.ok) { document.getElementById('clock').textContent = '—'; return; }
    all = await r.json();
    known = (all.games || []).length;
    games = (all.games || []).filter(g => g.board);
    where = all.where || '';
  } catch (e) {
    document.getElementById('sub').textContent = 'lost contact with the server';
    return;
  }

  // A neighbour's board takes a moment to arrive - the first poll sets the
  // fetch going and the next one has it. Say so, rather than flashing "no
  // tournament running" at a room where several are.
  if (!games.length && known) {
    document.getElementById('clock').textContent = '—';
    if (paintedPhase !== 'finding') {
      paintedPhase = 'finding';
      stage.innerHTML = '<div class="waiting">Finding the tournaments on ' +
                        'this network&hellip;</div>';
    }
    return;
  }

  const showAll = document.getElementById('showall');
  // One game and there is nothing to choose between; several and the wall is
  // the default, until somebody opens one.
  const chosen = games.length > 1 && focused !== null
    ? games.find(g => g.url === focused) || (games.length === 1 ? games[0] : null)
    : (games.length === 1 ? games[0] : null);
  showAll.hidden = !(chosen && games.length > 1);
  sayTheWayOut(showAll.hidden);

  if (games.length > 1 && !chosen) {
    document.getElementById('title').textContent =
      games.length + ' tournaments on the network';
    document.getElementById('sub').textContent = '';
    document.getElementById('clock').textContent = '—';
    stage.innerHTML = wall(games);
    paintedPhase = 'wall';
    foot(all);
    return;
  }

  const board = chosen ? chosen.board : {kind: 'idle', where: where};
  if (chosen && chosen.name) board.name = board.name || chosen.name;

  if (board.kind === 'idle') {
    document.getElementById('title').textContent = 'ELMER';
    document.getElementById('sub').textContent = '';
    document.getElementById('clock').textContent = '—';
    if (paintedPhase !== 'idle') { paintedPhase = 'idle'; stage.innerHTML = idle(board); }
    foot(all);
    return;
  }

  document.getElementById('title').textContent = board.name || 'ELMER';
  const h = board.health || {};
  /* A tournament has a length, so the room can be told where it is in it -
     "question 18 of 36, block 2 of 3" answers both "how much longer" and
     "when is somebody declared next", which are the two things a spectator
     standing at the back actually wants. */
  const plan = board.plan;
  const shootOn = board.shootout && board.shootout.on;
  const through = shootOn
    ? ` · shootout · ${(board.shootout.available || []).length} subjects left`
    : plan && plan.length
    ? ` · Q${Math.max(1, plan.asked)} of ${plan.length}` +
      (plan.blocks > 1 ? ` · block ${plan.block} of ${plan.blocks}` : '') +
      // Which order the draw is in is a claim, so it is stated: easiest
      // first only where the unit has measured enough to say so.
      (plan.ramped ? ' · easiest first' : '')
    : '';
  document.getElementById('sub').textContent = (board.kind === 'hall'
    ? `${board.units_present} table${board.units_present === 1 ? '' : 's'} · ` +
      `${board.players} player${board.players === 1 ? '' : 's'}`
    : `${board.people} player${board.people === 1 ? '' : 's'}` +
      (board.bots ? ` · ${board.bots} practice` : '')) + through;

  const hall = board.kind === 'hall';
  const round = board.round;
  const clock = document.getElementById('clock');
  if (round && !round.closed) {
    // A hall reports how long the round has been open; a table counts down.
    const left = hall
      ? Math.max(0, (round.seconds || 0) - (round.elapsed || 0))
      : (round.remaining || 0);
    clock.textContent = Math.ceil(left) + 's';
    clock.classList.toggle('done', left <= 0);
  } else {
    // "time" beside the answer read as a label for it. What has happened at
    // this point is that the round is scored, so that is what it says.
    clock.textContent = round ? 'scored' : '—';
    clock.classList.add('done');
  }

  const left = hall ? hallLeft : players;
  const right = hall ? lastRound : tableRound;

  // The phase includes whether the round is closed, so a table flips from the
  // question to the result the moment it is scored.
  const phase = board.kind + (round ? 'q' + round.number + (round.closed ? 'r' : '') : 'idle');
  if (phase !== paintedPhase) {
    paintedPhase = phase;
    const q = (round && round.question) || {};
    const showQuestion = round && !round.closed && q.text;
    stage.innerHTML = (showQuestion ? `
        <div class="question">
          <div class="tag">Round ${round.number} · ${esc(q.difficulty || '')} · ${esc(q.section || '')}</div>
          <p>${esc(q.text || '')}</p>
        </div>` : reveal(round, board.last)) +
      `<div class="cols">${left(board)}${right(board)}</div>`;
  } else {
    // Same phase: refresh only the side panels, so the question does not
    // flicker under a room full of people trying to read it.
    const cols = stage.querySelector('.cols');
    if (cols) cols.innerHTML = left(board) + right(board);
  }

  trimToFit();
  foot(all);

  const tag = stage.querySelector('.question .tag');
  if (tag && round && !round.closed) {
    tag.textContent = hall
      ? `Round ${round.number} · ${round.reported} of ${round.reported + round.awaiting} tables in`
      : `Round ${round.number} · ${round.answered} answered` +
        (round.waiting_on ? `, waiting on ${round.waiting_on}` : '');
  }
}

/* Getting off the board again.

   The board is usually the only thing on a screen - full screen, no chrome,
   no back button - so the way off it has to be on the wall. Escape is what a
   person presses; Q and Ctrl+C work too, and the corner is tappable because
   the Pi in front of most of these is a touchscreen with no keyboard at all.

   Where it goes depends on how it was opened. Net control now walks the host
   screen on to the board in its own window, so that the one Pi running the
   hall can put the room on its monitor without needing a second machine; Esc
   walks it back, and net control is whole again - the tables list, the code
   to join by, the controls. A board opened as a window of its own - which is
   how this used to work, and still is if somebody has a shortcut to it -
   closes instead, and only walks back if the browser refuses to close it. */
/* Counting the practice tables or not. It sits opposite the way out, is
   tappable because these are touchscreens, and answers to P as well for a
   board being driven from a keyboard at the back of a room. The choice is
   this screen's and it is remembered here: two boards watching one net may
   legitimately want different views of it, and neither is the net's business.
*/
const practiceHint = document.createElement('div');
practiceHint.className = 'practicehint';
practiceHint.addEventListener('click', () => togglePractice());
document.body.appendChild(practiceHint);

function sayPractice() {
  practiceHint.textContent = countPractice
    ? 'P or tap: counting practice tables'
    : 'P or tap: practice tables not counted';
  practiceHint.classList.toggle('off', !countPractice);
}

function togglePractice() {
  countPractice = !countPractice;
  try { localStorage.setItem('board.practice', countPractice ? '1' : '0'); }
  catch (e) { /* the view still changes; it just will not be remembered */ }
  sayPractice();
  paintedPhase = null;            // the panels are filtered, so repaint them
  tick();
}
sayPractice();

const BACK = '/net';
const popped = !!window.opener;   // a window of its own, not a page we walked to

const hint = document.createElement('div');
hint.className = 'closehint';
hint.style.cursor = 'pointer';
hint.addEventListener('click', () => closeBoard());
document.body.appendChild(hint);

/* The corner says where the next step out actually goes, because the step
   changes: out of one tournament is the wall of them, out of the wall is net
   control. A label that said "close" while Escape did something else would be
   the sort of control that looks answered and is not. */
function sayTheWayOut(atTheTop) {
  if (hint.classList.contains('armed')) return;   // mid-close; leave it be
  if (!atTheTop) {
    hint.textContent = 'Esc, Q or tap here for all tournaments';
    hint.title = 'back to the wall of tournaments';
  } else if (popped) {
    hint.textContent = 'Ctrl+C, Esc or Q to close';
    hint.title = 'close the board';
  } else {
    hint.textContent = 'Esc, Q or tap here for net control';
    hint.title = 'back to net control';
  }
}
sayTheWayOut(true);

function closeBoard() {
  // Escape backs out a step at a time. On a network running several
  // tournaments the board can be opened on to one of them, and the step out
  // of that is the wall of all of them - not off the board altogether, which
  // would skip a level nobody asked to leave.
  const showAll = document.getElementById('showall');
  if (showAll && !showAll.hidden) { showAll.click(); return; }

  hint.classList.add('armed');
  if (!popped) { location.href = BACK; return; }
  hint.textContent = 'closing…';
  try { window.close(); } catch (e) { /* refused; the walk back covers it */ }
  setTimeout(() => {
    if (!window.closed) location.href = BACK;
  }, 250);
}

document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePractice(); return; }
  if (e.key === 'Escape' || e.key === 'q' || e.key === 'Q'
      || (e.ctrlKey && (e.key === 'c' || e.key === 'C'))) {
    // Ctrl+C is copy when there is a selection; only take it when there
    // is nothing selected, so nobody loses a copy they meant to make.
    if (e.ctrlKey && String(window.getSelection() || '')) return;
    e.preventDefault();
    closeBoard();
  }
});

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
