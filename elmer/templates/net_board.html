<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big board &middot; ELMER</title>
<link rel="stylesheet" href="{{ url_for('static', filename='elmer.css') }}">
<style>
/* Read from the back of a hall, by people holding a paper plate. Everything
   here is sized for distance: few things on screen, all of them large. */
body { margin: 0; background: var(--bg); color: var(--text);
       font-family: var(--sans); overflow: hidden; }
.board { height: 100dvh; display: flex; flex-direction: column; padding: 1.4vh 1.6vw; }
.head { display: flex; align-items: baseline; gap: 1.2vw; margin-bottom: 1.2vh; }
.head h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2.6rem); letter-spacing: .01em; }
.head .sub { color: var(--dim); font-size: clamp(.8rem, 1.3vw, 1.2rem); }
.head .clock { margin-left: auto; font-family: var(--mono);
               font-size: clamp(1.6rem, 5vw, 4.5rem); color: var(--amber);
               font-variant-numeric: tabular-nums; line-height: 1; }
.head .clock.done { color: var(--dim); }

.question { background: var(--panel); border: 1px solid var(--line);
            border-radius: 14px; padding: 1.6vh 1.6vw; margin-bottom: 1.4vh; }
.question .tag { color: var(--dim); font-family: var(--mono);
                 font-size: clamp(.7rem, 1.1vw, 1rem); }
.question p { margin: .4vh 0 0; font-size: clamp(1.1rem, 2.4vw, 2.2rem);
              line-height: 1.35; }

.cols { flex: 1; display: grid; grid-template-columns: 1.15fr 1fr;
        gap: 1.4vw; min-height: 0; }
.panelbox { background: var(--panel); border: 1px solid var(--line);
            border-radius: 14px; padding: 1.2vh 1.2vw; overflow: hidden;
            display: flex; flex-direction: column; }
.panelbox h2 { margin: 0 0 .8vh; font-size: clamp(.85rem, 1.4vw, 1.3rem);
               color: var(--dim); font-weight: 600; letter-spacing: .04em;
               text-transform: uppercase; }
table { width: 100%; border-collapse: collapse; }
td { padding: .55vh .4vw; border-bottom: 1px solid var(--line);
     font-size: clamp(.85rem, 1.5vw, 1.5rem); }
td.pos { color: var(--dim); width: 2.6ch; font-family: var(--mono); }
td.pts, td.ms { text-align: right; font-family: var(--mono); }
td.ms { color: var(--dim); }
tr.lead td { color: var(--amber); font-weight: 700; }
tr.gold td { color: #ffd479; }
.tally { display: flex; gap: 1vw; margin-bottom: 1.2vh; }
.tally div { flex: 1; background: var(--panel-2); border-radius: 12px;
             padding: .9vh 1vw; }
.tally b { display: block; font-family: var(--mono);
           font-size: clamp(1.2rem, 3vw, 2.6rem); line-height: 1.1; }
.tally span { color: var(--dim); font-size: clamp(.65rem, 1vw, .95rem);
              text-transform: uppercase; letter-spacing: .05em; }
.waiting { text-align: center; color: var(--dim); padding: 6vh 2vw;
           font-size: clamp(1rem, 2vw, 1.8rem); }
.picker { margin-top: 1vh; text-align: center; color: var(--amber);
          font-size: clamp(.9rem, 1.7vw, 1.6rem); }
.idle { display: flex; flex-direction: column; align-items: center;
        justify-content: center; flex: 1; text-align: center; gap: 1.4vh; }
.idle h2 { margin: 0; font-size: clamp(1.4rem, 4vw, 3rem); }
.idle p { margin: 0; color: var(--dim); font-size: clamp(.9rem, 1.8vw, 1.6rem);
          max-width: 40ch; line-height: 1.5; }
.idle .addr { font-family: var(--mono); color: var(--amber);
              font-size: clamp(1rem, 2.4vw, 2rem); }
.closehint { position: fixed; right: .8vw; bottom: .6vh; color: var(--dimmer);
             font-size: clamp(.6rem, 1vw, .9rem); font-family: var(--mono);
             opacity: .55; }
.closehint.armed { color: var(--amber); opacity: 1; }
</style>
</head>
<body>
<div class="board">
  <div class="head">
    <h1 id="title">ELMER</h1>
    <span class="sub" id="sub"></span>
    <span class="clock" id="clock">—</span>
  </div>
  <div id="stage"><div class="waiting">Waiting for net control…</div></div>
</div>

<script>
const stage = document.getElementById('stage');
let paintedRound = null, paintedPhase = null;

function esc(s) { const d = document.createElement('div');
                  d.textContent = s == null ? '' : s; return d.innerHTML; }

function standings(board) {
  const rows = (board.units || []).slice(0, 10).map((u, i) => `
    <tr class="${i === 0 && u.score > 0 ? 'gold' : ''}">
      <td class="pos">${i + 1}</td>
      <td>${esc(u.name)}${u.present ? '' : ' <span style="color:var(--dimmer)">(quiet)</span>'}</td>
      <td class="ms">${u.players}</td>
      <td class="pts">${u.score}</td>
    </tr>`).join('');
  return `<div class="panelbox"><h2>Tables</h2><table>${rows}</table></div>`;
}

function lastRound(board) {
  const last = board.last;
  if (!last) return `<div class="panelbox"><h2>Last round</h2>
      <div class="waiting">No rounds yet</div></div>`;
  const top = (last.top || []).slice(0, 8).map((r, i) => `
    <tr class="${i === 0 ? 'lead' : ''}">
      <td class="pos">${r.place}</td>
      <td>${esc(r.name)}</td>
      <td class="ms">${esc(r.unit_name)}</td>
      <td class="ms">${(r.ms / 1000).toFixed(2)}s</td>
    </tr>`).join('');
  return `<div class="panelbox">
      <h2>Round ${last.number} &mdash; fastest correct</h2>
      <div class="tally">
        <div><b>${last.correct}</b><span>correct</span></div>
        <div><b>${last.answers}</b><span>answers</span></div>
        <div><b>${last.units_reported}</b><span>tables in</span></div>
      </div>
      <table>${top}</table>
      ${last.winner_unit ? `<div class="picker">${esc(last.winner_unit)} chooses the next question</div>` : ''}
    </div>`;
}

function players(board) {
  /* One table's own leaderboard - the view for a club night rather than a
     hall, so somebody's family can watch them climb it. */
  const all = [];
  (board.cohorts || []).forEach(c => (c.members || []).forEach(m => all.push(m)));
  all.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  const rows = all.slice(0, 12).map((m, i) => `
    <tr class="${i === 0 && m.score > 0 ? 'gold' : ''}">
      <td class="pos">${i + 1}</td>
      <td>${esc(m.name)}${m.bot ? ` <span style="color:var(--dimmer)">${esc(m.bot)}</span>` : ''}</td>
      <td class="ms">${m.correct}/${m.answered}</td>
      <td class="pts">${m.score}</td>
    </tr>`).join('');
  return `<div class="panelbox"><h2>Players</h2><table>${rows}</table></div>`;
}

function tableRound(board) {
  const r = board.round;
  if (!r || !r.closed) {
    const c = (board.cohorts || []).map(x => `
      <tr><td class="pos"></td><td>${esc(x.name)}</td>
          <td class="ms">${x.players}</td><td class="pts">${x.score}</td></tr>`).join('');
    return `<div class="panelbox"><h2>Cohorts</h2><table>${c}</table></div>`;
  }
  const res = (r.results || []).slice(0, 10).map(a => `
    <tr class="${a.place === 1 ? 'lead' : ''}">
      <td class="pos">${a.place || '–'}</td>
      <td>${esc(a.name)} ${a.correct ? '✓' : '✗'}</td>
      <td class="ms">${(a.ms / 1000).toFixed(2)}s</td>
      <td class="pts">${a.points || 0}</td>
    </tr>`).join('');
  const right = (r.results || []).filter(a => a.correct).length;
  return `<div class="panelbox">
      <h2>Round ${r.number} &mdash; fastest correct</h2>
      <div class="tally">
        <div><b>${right}</b><span>correct</span></div>
        <div><b>${(r.results || []).length}</b><span>answered</span></div>
      </div>
      <table>${res}</table>
      ${r.winner_cohort ? `<div class="picker">Cohort ${r.winner_cohort} takes the round</div>` : ''}
    </div>`;
}

function idle(board) {
  return `<div class="idle">
      <h2>No tournament running</h2>
      <p>Start one from a licence class on the dashboard, or open net control
         to run a hall of tables.</p>
      <p class="addr">${esc(board.where || '')}</p>
    </div>`;
}

async function tick() {
  let board;
  try {
    const r = await fetch('/api/board');
    if (!r.ok) { document.getElementById('clock').textContent = '—'; return; }
    board = await r.json();
  } catch (e) {
    document.getElementById('sub').textContent = 'lost contact with the server';
    return;
  }

  if (board.kind === 'idle') {
    document.getElementById('title').textContent = 'ELMER';
    document.getElementById('sub').textContent = '';
    document.getElementById('clock').textContent = '—';
    if (paintedPhase !== 'idle') { paintedPhase = 'idle'; stage.innerHTML = idle(board); }
    return;
  }

  document.getElementById('title').textContent = board.name || 'ELMER';
  const h = board.health || {};
  document.getElementById('sub').textContent = board.kind === 'hall'
    ? `${board.units_present} table${board.units_present === 1 ? '' : 's'} · ` +
      `${board.players} player${board.players === 1 ? '' : 's'}`
    : `${board.people} player${board.people === 1 ? '' : 's'}` +
      (board.bots ? ` · ${board.bots} practice` : '');

  const hall = board.kind === 'hall';
  const round = board.round;
  const clock = document.getElementById('clock');
  if (round && !round.closed) {
    // A hall reports how long the round has been open; a table counts down.
    const left = hall
      ? Math.max(0, (round.seconds || 0) - (round.elapsed || 0))
      : (round.remaining || 0);
    clock.textContent = Math.ceil(left) + 's';
    clock.classList.toggle('done', left <= 0);
  } else {
    clock.textContent = round ? 'time' : '—';
    clock.classList.add('done');
  }

  const left = hall ? standings : players;
  const right = hall ? lastRound : tableRound;

  // The phase includes whether the round is closed, so a table flips from the
  // question to the result the moment it is scored.
  const phase = board.kind + (round ? 'q' + round.number + (round.closed ? 'r' : '') : 'idle');
  if (phase !== paintedPhase) {
    paintedPhase = phase;
    const q = (round && round.question) || {};
    const showQuestion = round && !round.closed && q.text;
    stage.innerHTML = (showQuestion ? `
        <div class="question">
          <div class="tag">Round ${round.number} · ${esc(q.difficulty || '')} · ${esc(q.section || '')}</div>
          <p>${esc(q.text || '')}</p>
        </div>` : '') +
      `<div class="cols">${left(board)}${right(board)}</div>`;
  } else {
    // Same phase: refresh only the side panels, so the question does not
    // flicker under a room full of people trying to read it.
    const cols = stage.querySelector('.cols');
    if (cols) cols.innerHTML = left(board) + right(board);
  }

  const tag = stage.querySelector('.question .tag');
  if (tag && round && !round.closed) {
    tag.textContent = hall
      ? `Round ${round.number} · ${round.reported} of ${round.reported + round.awaiting} tables in`
      : `Round ${round.number} · ${round.answered} answered` +
        (round.waiting_on ? `, waiting on ${round.waiting_on}` : '');
  }
}

/* Closing it. A board is usually the only thing on a screen at the front of a
   room, often full screen with no visible chrome, so there has to be a way off
   it from the keyboard of the machine driving it. Ctrl+C is what people reach
   for; Esc and Q work too. A window opened from a link cannot always close
   itself, so if it is still here a moment later we go back to net control
   rather than leaving somebody stuck. */
const hint = document.createElement('div');
hint.className = 'closehint';
hint.textContent = 'Ctrl+C, Esc or Q to close';
document.body.appendChild(hint);

function closeBoard() {
  hint.classList.add('armed');
  hint.textContent = 'closing…';
  try { window.close(); } catch (e) { /* not opened by script */ }
  setTimeout(() => {
    if (!window.closed) location.href = '/net';
  }, 250);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'q' || e.key === 'Q'
      || (e.ctrlKey && (e.key === 'c' || e.key === 'C'))) {
    // Ctrl+C is copy when there is a selection; only take it when there
    // is nothing selected, so nobody loses a copy they meant to make.
    if (e.ctrlKey && String(window.getSelection() || '')) return;
    e.preventDefault();
    closeBoard();
  }
});

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
