<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Table {{ table }} &middot; ELMER</title>
<link rel="stylesheet" href="{{ asset('elmer.css') }}">
<style>
/* A phone held in a noisy hall, at arm's length, by somebody who has not used
   this before and will not read instructions. Big targets, one thing on the
   screen at a time, and no navigation to get lost in. */
body { margin: 0; background: var(--bg); color: var(--text);
       font-family: var(--sans); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 34rem; margin: 0 auto; padding: 1rem 1rem 3rem;
        min-height: 100dvh; display: flex; flex-direction: column; }
.tablebar { display: flex; align-items: baseline; gap: .5rem;
            padding: .3rem 0 .8rem; border-bottom: 1px solid var(--line);
            margin-bottom: 1rem; }
.tablebar b { font-size: 1.05rem; }
.tablebar .who { margin-left: auto; color: var(--dim); font-size: .85rem; }
.tablebar .leave { margin-left: .6rem; background: none; border: 0;
                   color: var(--dimmer); font: inherit; font-size: .8rem;
                   text-decoration: underline; cursor: pointer; padding: 0; }
.big { font-size: 1.25rem; line-height: 1.45; margin: 0 0 1.1rem; }
.choice { display: block; width: 100%; text-align: left; margin: 0 0 .7rem;
          padding: 1rem 1.1rem; font-size: 1.05rem; line-height: 1.4;
          border-radius: 12px; border: 1px solid var(--line-2);
          background: var(--panel-2); color: var(--text);
          font-family: inherit; cursor: pointer; }
.choice:active { transform: scale(.99); }
.choice[disabled] { opacity: .5; }
.choice .k { display: inline-block; min-width: 1.6rem; font-weight: 700;
             color: var(--amber); }
.choice.picked { border-color: var(--amber); background: #2a2216; }
.choice.right  { border-color: var(--green); background: #14301b; }
.choice.wrong  { border-color: var(--red);   background: #331a1a; }
.clock { font-variant-numeric: tabular-nums; font-family: var(--mono);
         color: var(--dim); }
.clock.urgent { color: var(--amber); }
/* Shootout. The word is the score: five letters and you are out, so it is
   written big where a points total would go, and the letters not yet taken
   are shown faint so E L _ _ _ reads as two of five rather than as "EL". */
.word { font-family: var(--mono); letter-spacing: .35em; font-size: 1.6rem;
        font-weight: 700; }
.word i { font-style: normal; color: var(--line-2); }
.word.out { color: var(--red); }
.shoot { margin: .6rem 0 0; text-align: left; }
.state .pick, .state .pick h3, .state .pick h4 { text-align: left; }
.shoot table { width: 100%; border-collapse: collapse; }
.shoot td { padding: .3rem .2rem; border-bottom: 1px solid var(--line); }
.shoot td.w { text-align: right; font-family: var(--mono); letter-spacing: .2em; }
.shoot tr.me td { color: var(--amber); }
.shoot tr.gone td { opacity: .45; }
.shoot .took { color: var(--red); font-size: .85rem; }
.pick h3 { margin: .8rem 0 .4rem; }
.pick h4 { margin: .9rem 0 .35rem; color: var(--dim); font-weight: 600;
           font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; }
.pick .choice { padding: .6rem .8rem; font-size: .95rem; }
.pick .choice .k { min-width: 3.2rem; color: var(--dim); font-weight: 400; }
.state { text-align: center; padding: 3rem 1rem; color: var(--dim); }
.state h2 { color: var(--text); margin: 0 0 .5rem; }
.verdict { text-align: center; padding: 1.4rem 1rem; border-radius: 12px;
           margin-bottom: 1rem; }
.verdict.right { background: #14301b; border: 1px solid var(--green); }
.verdict.wrong { background: #331a1a; border: 1px solid var(--red); }
.verdict .h { font-size: 1.4rem; font-weight: 700; }
.verdict .t { color: var(--dim); font-size: .9rem; margin-top: .25rem; }
.mine { font-family: var(--mono); font-size: 1.6rem; }
table.board { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.board td { padding: .4rem .3rem; border-bottom: 1px solid var(--line); }
table.board td.n { color: var(--dim); width: 2rem; }
table.board td.ms { text-align: right; font-family: var(--mono);
                    color: var(--dim); }
table.board tr.me td { color: var(--amber); font-weight: 600; }
.join input { width: 100%; padding: .9rem 1rem; font-size: 1.1rem;
              border-radius: 12px; border: 1px solid var(--line-2);
              background: var(--panel); color: var(--text); }
.err { color: var(--red); margin-top: .8rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tablebar">
    <b>{{ name }}</b>
    <span class="who" id="who"></span>
    <button class="leave" id="leave" hidden>leave</button>
  </div>
  <div id="view"><div class="state"><h2>Connecting…</h2></div></div>
</div>
<script>
const TABLE = {{ table|tojson }};
let me = null;              // {id, name, cohort}
let shownRound = null;      // round number currently painted
let paintedAt = 0;          // when this phone actually drew the question
let answered = false;
let poll = null;

const view = document.getElementById('view');
const who = document.getElementById('who');

async function api(path, body) {
  const opt = body ? {method: 'POST', headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return {ok: r.ok, status: r.status, data: await r.json().catch(() => ({}))};
}

/* ---------------------------------------------------------------- joining */
function showJoin(reason) {
  view.innerHTML = `
    <div class="join">
      <p class="big">What should we call you?</p>
      <input id="nm" maxlength="24" autocomplete="off" autocapitalize="words"
             placeholder="Your name or callsign">
      <button class="btn primary wide" id="go" style="margin-top:1rem">Join this table</button>
      ${reason ? `<div class="err">${reason}</div>` : ''}
    </div>`;
  const nm = document.getElementById('nm');
  const go = document.getElementById('go');
  const saved = localStorage.getItem('elmer_party_name');
  if (saved) nm.value = saved;
  nm.focus();
  const join = async () => {
    const name = nm.value.trim();
    if (!name) { nm.focus(); return; }
    go.disabled = true; go.textContent = 'Joining…';
    localStorage.setItem('elmer_party_name', name);
    const r = await api('/api/party/join', {name});
    if (!r.data.joined) { showJoin(r.data.reason || 'Could not join.'); return; }
    me = r.data.player;
    sessionStorage.setItem('elmer_party_player', JSON.stringify(me));
    who.textContent = me.name + ' · Cohort ' + me.cohort;
    leaveBtn.hidden = false;
    start();
  };
  go.addEventListener('click', join);
  nm.addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
}

/* ----------------------------------------------------------------- rounds */
/* Waiting used to be all this screen could say, and on a table nobody was
   running it said it for ever. Now it says what it is waiting for: a
   countdown that is already going to fire, or - for somebody sitting here on
   their own - a press. The server checks that permission again when the press
   arrives; this only decides whether to offer it. */
function paintWaiting(state) {
  const n = (state.cohorts || []).reduce((a, c) => a + c.players, 0);
  const secs = state.starts_in;
  const soon = secs !== null && secs !== undefined;
  const shoot = state.shootout;
  if (shoot) {
    // A shootout between questions: the word so far, and either the pick
    // or who is being waited on for it.
    view.innerHTML = `<div class="state" style="padding:1rem .2rem">
        <h2>Shootout</h2>${paintShootout(shoot)}
        ${shoot.your_pick ? paintPick(shoot)
          : `<p style="padding:1rem 0">${waitingLine(shoot)}</p>`}</div>`;
    wirePick();
    return;
  }
  view.innerHTML = `<div class="state">
      <h2>You're in.</h2>
      ${soon
        ? `<p>Starting in <b>${Math.ceil(secs)}</b>&hellip;</p>`
        : (state.may_start
            ? `<p>Nobody else is here, so it is yours to begin.</p>
               <button class="btn primary" id="startnow">Start</button>`
            : `<p>Waiting for the next question.</p>`)}
      <p class="clock">${n} player${n === 1 ? '' : 's'} at this table</p>
    </div>`;
  const go = document.getElementById('startnow');
  if (go) go.addEventListener('click', async () => {
    go.disabled = true;
    go.textContent = 'Starting\u2026';
    try {
      await api('/api/party/start-now', {});
    } catch (err) {
      go.disabled = false;
      go.textContent = 'Start';
    }
  });
}

function paintQuestion(round) {
  const q = round.question || {};
  answered = false;
  paintedAt = performance.now();     // the clock the race is actually timed on
  const choices = (q.choices || []).map((c, i) =>
    `<button class="choice" data-i="${i}">
       <span class="k">${'ABCD'[i]}</span>${escapeHTML(c)}</button>`).join('');
  view.innerHTML = `
    <div style="display:flex;gap:.6rem;align-items:baseline;margin-bottom:.6rem">
      <span class="clock">Q${round.number}</span>
      <span class="clock" style="color:var(--dimmer)">${escapeHTML(q.section || '')}</span>
      <span class="clock" id="left" style="margin-left:auto"></span>
    </div>
    <p class="big">${escapeHTML(q.text || '')}</p>
    ${q.figure ? `<img src="${q.figure}" alt="" style="max-width:100%;border-radius:10px;margin-bottom:1rem">` : ''}
    <div id="choices">${choices}</div>`;
  document.querySelectorAll('.choice').forEach(b => {
    b.addEventListener('click', () => send(parseInt(b.dataset.i, 10), b));
  });
}

async function send(index, button) {
  if (answered) return;
  answered = true;
  // The interval this phone measured, from painting the question to the tap.
  // Network time is deliberately not in it - that is the whole point.
  const ms = Math.round(performance.now() - paintedAt);
  document.querySelectorAll('.choice').forEach(b => { b.disabled = true; });
  button.classList.add('picked');
  const r = await api('/api/party/answer', {player: me.id, chosen: index, ms});
  if (!r.data.accepted) {
    answered = false;
    document.querySelectorAll('.choice').forEach(b => { b.disabled = false; });
    button.classList.remove('picked');
  }
}

/* In a shootout the verdict is about letters, not points: whether the shot
   was made, and whether you are paying for it. The tournament's card -
   "1st on this table, 10 points" - is true and beside the point. */
function shootVerdict(mine, shoot) {
  const last = shoot.last_shot || {};     // the shot this round was, not a pass since
  const iPicked = last.picker === me.id;
  const took = (last.took || []).includes(me.id);
  const ms = mine ? `<div class="mine">${(mine.ms / 1000).toFixed(2)}s</div>` : '';
  if (iPicked) {
    return last.made
      ? `<div class="verdict right"><div class="h">You made it</div>${ms}
           <div class="t">${(last.took || []).length
             ? escapeHTML(whoTook(shoot, last.took)) + ' took a letter · you keep the pick'
             : 'Everybody matched it · you keep the pick'}</div></div>`
      : `<div class="verdict wrong"><div class="h">Missed</div>${ms}
           <div class="t">Your shot, so nobody takes a letter · the pick moves on</div></div>`;
  }
  if (mine && mine.correct) {
    return `<div class="verdict right"><div class="h">Safe</div>${ms}
      <div class="t">${last.made ? 'You matched the picker' : 'Right, and the picker missed'}</div></div>`;
  }
  const word = ((shoot.standing || []).find(r => r.player === me.id) || {}).word || '';
  if (took) {
    return `<div class="verdict wrong"><div class="h">A letter for you</div>${ms}
      <div class="t">The picker made it and you did not · ${escapeHTML(word)}</div></div>`;
  }
  return `<div class="verdict wrong"><div class="h">${mine ? 'Not this time' : 'No answer'}</div>${ms}
    <div class="t">But the picker missed too, so no letter</div></div>`;
}

function paintResults(round, shoot) {
  const rows = (round.results || []);
  const mine = rows.find(r => r.player_id === me.id);
  const top = rows.slice(0, 8).map((r, i) => `
    <tr class="${r.player_id === me.id ? 'me' : ''}">
      <td class="n">${r.place || '–'}</td>
      <td>${escapeHTML(r.name)} ${r.correct ? '✓' : '✗'}</td>
      <td class="ms">${(r.ms / 1000).toFixed(2)}s</td>
      ${shoot ? '' : `<td class="ms">${r.points || 0}</td>`}
    </tr>`).join('');
  view.innerHTML = `
    ${shoot ? shootVerdict(mine, shoot)
     : mine ? `<div class="verdict ${mine.correct ? 'right' : 'wrong'}">
        <div class="h">${mine.correct ? 'Correct' : 'Not this time'}</div>
        <div class="mine">${(mine.ms / 1000).toFixed(2)}s</div>
        <div class="t">${mine.correct
          ? `${ordinal(mine.place)} on this table · ${mine.points} points`
          : 'No points for this one'}</div>
      </div>`
      : `<div class="verdict wrong"><div class="h">No answer</div>
         <div class="t">You did not get one in before time</div></div>`}
    <table class="board">${top}</table>
    ${paintShootout(shoot, false)}
    ${shoot && shoot.your_pick ? paintPick(shoot)
      : `<p class="state" style="padding:1.4rem 0">${waitingLine(shoot)}</p>`}`;
  wirePick();
}

/* ------------------------------------------------------------- shootout */
function wordHTML(row) {
  const have = row.word || '', all = 'ELMER';
  return `<span class="word ${row.out ? 'out' : ''}">${escapeHTML(have)}<i>${
    all.slice(have.length).split('').join('')}</i></span>`;
}

function nameOf(shoot, id) {
  const row = (shoot.standing || []).find(r => r.player === id);
  return row ? (row.player === me.id ? 'you' : row.name) : 'somebody';
}

/* "Bob, Hertz and you took a letter" rather than "3 took a letter": at a
   table of five the names are the news. Past four it counts the rest. */
function whoTook(shoot, took) {
  const names = took.slice(0, 4).map(id => nameOf(shoot, id));
  const more = took.length - names.length;
  let list = names.length <= 1 ? names.join('')
           : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  if (more > 0) list += ` and ${more} more`;
  return list;
}

function paintShootout(shoot, withNote) {
  if (!shoot) return '';
  const last = shoot.last || {};
  const took = (last.took || []);
  const rows = (shoot.standing || []).map(r => `
    <tr class="${r.player === me.id ? 'me' : ''} ${r.gone ? 'gone' : ''}">
      <td>${escapeHTML(r.name)}${r.picking && !shoot.over ? ' · picking' : ''}${
        r.bot ? ' <span class="took" style="color:var(--dim)">practice</span>' : ''}</td>
      <td class="w">${wordHTML(r)}</td>
    </tr>`).join('');
  let note = '';
  if (shoot.over) {
    note = shoot.drawn ? 'Out of subjects with nobody ahead: a draw.'
         : shoot.winner === me.id ? 'You win it.'
         : `${escapeHTML(shoot.winner_name || 'Somebody')} wins it.`;
  } else if (last.passed) {
    note = `${escapeHTML(nameOf(shoot, last.picker))} ran out of time, so the pick moved on. No letters.`;
  } else if (last.section) {
    const picker = escapeHTML(nameOf(shoot, last.picker));
    note = last.made
      ? (took.length ? `${picker === 'you' ? 'You' : picker} made it. ${escapeHTML(whoTook(shoot, took))} took a letter.`
                     : `${picker === 'you' ? 'You' : picker} made it, and so did everybody else.`)
      : `${picker === 'you' ? 'You' : picker} missed, so nobody takes a letter.`;
  }
  // The note is the table's summary; under a verdict card it would say the
  // same thing twice, so the results screen leaves it out.
  return `<div class="shoot">${note && withNote !== false ? `<p class="took">${note}</p>` : ''}
            <table>${rows}</table></div>`;
}

/* The picker's screen: the subjects left, as buttons. The judgement being
   made is "what do I know that they do not", which is a subject-level one,
   so it is subjects rather than questions - and the ones already spent are
   simply not offered, because the rule is that a subject is played once. */
function paintPick(shoot) {
  // Grouped under the subelement - "T5 · Electrical Principles" - so a
  // picker who knows they are good at electrical principles finds all six of
  // those subjects together rather than hunting a list of thirty-three.
  let group = null, out = '';
  (shoot.available || []).forEach(a => {
    if (a.group !== group) {
      group = a.group;
      out += `<h4>${escapeHTML(a.group)}${a.group_title ? ' · ' + escapeHTML(a.group_title) : ''}</h4>`;
    }
    out += `<button class="choice" data-section="${escapeHTML(a.section)}">
      <span class="k">${escapeHTML(a.section)}</span>${escapeHTML(a.title)}</button>`;
  });
  return `<div class="pick"><h3>${pickGreeting(shoot)}
      <span class="clock" id="pickleft"></span></h3>
      <p class="tiny muted" style="margin:0 0 .5rem">Choose the subject. The board picks the question.</p>${out}</div>`;
}

/* How the pick arrived is worth a different first line: one that was earned
   is a small moment and should be met as one; one that came round because
   nobody got the question is just a turn. */
function pickGreeting(shoot) {
  switch (shoot.pick_reason) {
    case 'kept':     return 'Nice one \u2014 you made it. Your pick again.';
    case 'quickest': return 'Quickest right answer. Your pick.';
    case 'first':    return 'You\u2019re up first. Your pick.';
    case 'admitted': return 'You\u2019re in, and it\u2019s your pick.';
    case 'timeout':  return 'Time ran out over there. Your pick.';
    default:         return 'It comes round to you. Your pick.';
  }
}

function wirePick() {
  document.querySelectorAll('.pick .choice').forEach(b =>
    b.addEventListener('click', async () => {
      document.querySelectorAll('.pick .choice').forEach(x => { x.disabled = true; });
      b.classList.add('picked');
      try {
        const r = await api('/api/party/pick', {player: me.id, section: b.dataset.section});
        if (r.status !== 200) {
          document.querySelectorAll('.pick .choice').forEach(x => { x.disabled = false; });
          b.classList.remove('picked');
        }
      } catch (e) {
        document.querySelectorAll('.pick .choice').forEach(x => { x.disabled = false; });
        b.classList.remove('picked');
      }
    }));
}

function waitingLine(shoot) {
  if (!shoot) return 'Waiting for the next question…';
  // A finished game is not waiting for anything, and saying it is would
  // leave everybody at the table watching for a question that never comes.
  if (shoot.over) return 'The shootout is over. The table can start another.';
  if (shoot.pick) return `${escapeHTML(shoot.picker_name || 'The picker')} chose ${
    escapeHTML(shoot.pick_title || shoot.pick)}. Next question coming…`;
  return `Waiting for ${escapeHTML(shoot.picker_name || 'the picker')} to choose the subject… ` +
         `<span class="clock" id="pickleft"></span>`;
}

/* The pick's clock, refreshed each poll the way the question's is - without
   repainting the list, which would pull the buttons out from under a thumb. */
function paintPickClock(shoot) {
  const el = document.getElementById('pickleft');
  if (!el) return;
  const left = shoot && shoot.pick_remaining;
  el.textContent = (left === null || left === undefined) ? '' : Math.ceil(left) + 's';
  el.classList.toggle('urgent', left !== null && left !== undefined && left <= 10);
}

function ordinal(n) {
  if (!n) return '';
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function escapeHTML(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

/* ------------------------------------------------------------------ poll */
async function tick() {
  let r;
  try {
    r = await api('/api/party/state?player=' + me.id);
  } catch (e) { return; }
  if (r.status === 404) { clearInterval(poll); showJoin('The party has ended.'); return; }
  const s = r.data, round = s.round, shoot = s.shootout;
  // The pick is part of what is on screen, so a change in whose it is - or
  // in whether it has been made - repaints, even with no new round.
  const pickKey = shoot ? ('|' + (shoot.picker || '') + (shoot.pick || '') + (shoot.over ? 'over' : '')) : '';

  if (!round) {
    if (shownRound !== 'none' + pickKey) { shownRound = 'none' + pickKey; paintWaiting(s); }
    paintPickClock(shoot);
    return;
  }

  if (round.closed) {
    if (shownRound !== 'closed-' + round.number + pickKey) {
      shownRound = 'closed-' + round.number + pickKey;
      paintResults(round, shoot);
    }
    paintPickClock(shoot);
    return;
  }
  if (shownRound !== round.number) {
    shownRound = round.number;
    paintQuestion(round);
  }
  const left = document.getElementById('left');
  if (left) {
    left.textContent = Math.ceil(round.remaining) + 's';
    left.classList.toggle('urgent', round.remaining <= 10);
  }
}

function start() {
  if (poll) clearInterval(poll);
  tick();
  poll = setInterval(tick, 1000);
}

/* A phone that locks and comes back should not sit on a stale question. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && me) tick();
});

const leaveBtn = document.getElementById('leave');
leaveBtn.addEventListener('click', async () => {
  if (!confirm('Leave the table?')) return;
  if (poll) clearInterval(poll);
  try { await api('/api/party/leave', {player: me.id}); } catch (e) { /* going anyway */ }
  sessionStorage.removeItem('elmer_party_player');
  me = null; shownRound = null;
  who.textContent = '';
  leaveBtn.hidden = true;
  showJoin(null);
});

const remembered = sessionStorage.getItem('elmer_party_player');
if (remembered) {
  me = JSON.parse(remembered);
  who.textContent = me.name + ' · Cohort ' + me.cohort;
  leaveBtn.hidden = false;
  start();
} else {
  showJoin(null);
}
</script>
</body>
</html>
