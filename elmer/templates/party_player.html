<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>{{ name }} &middot; ELMER</title>
<link rel="stylesheet" href="{{ asset('elmer.css') }}">
<style>
/* A phone held in a noisy hall, at arm's length, by somebody who has not used
   this before and will not read instructions. Big targets, one thing on the
   screen at a time, and no navigation to get lost in. */
body { margin: 0; background: var(--bg); color: var(--text);
       font-family: var(--sans); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 34rem; margin: 0 auto; padding: 1rem 1rem 3rem;
        min-height: 100dvh; display: flex; flex-direction: column; }
.tablebar { display: flex; align-items: baseline; gap: .5rem;
            padding: .3rem 0 .8rem; border-bottom: 1px solid var(--line);
            margin-bottom: 1rem; }
.tablebar b { font-size: 1.05rem; }
.tablebar .who { margin-left: auto; color: var(--dim); font-size: .85rem; }
.tablebar .leave { margin-left: .6rem; background: none; border: 0;
                   color: var(--dimmer); font: inherit; font-size: .8rem;
                   text-decoration: underline; cursor: pointer; padding: 0; }
.big { font-size: 1.25rem; line-height: 1.45; margin: 0 0 1.1rem; }
.choice { display: block; width: 100%; text-align: left; margin: 0 0 .7rem;
          padding: 1rem 1.1rem; font-size: 1.05rem; line-height: 1.4;
          border-radius: 12px; border: 1px solid var(--line-2);
          background: var(--panel-2); color: var(--text);
          font-family: inherit; cursor: pointer; }
.choice:active { transform: scale(.99); }
.choice[disabled] { opacity: .5; }
.choice .k { display: inline-block; min-width: 1.6rem; font-weight: 700;
             color: var(--amber); }
.choice.picked { border-color: var(--amber); background: #2a2216; }
.choice.right  { border-color: var(--green); background: #14301b; }
.choice.wrong  { border-color: var(--red);   background: #331a1a; }
.clock { font-variant-numeric: tabular-nums; font-family: var(--mono);
         color: var(--dim); }
.clock.urgent { color: var(--amber); }
/* Shootout. The word is the score: five letters and you are out, so it is
   written big where a points total would go, and the letters not yet taken
   are shown faint so E L _ _ _ reads as two of five rather than as "EL". */
.word { font-family: var(--mono); letter-spacing: .35em; font-size: 1.6rem;
        font-weight: 700; }
.word i { font-style: normal; color: var(--line-2); }
.word.out { color: var(--red); }
.shoot { margin: .6rem 0 0; text-align: left; }
.state .pick, .state .pick h3, .state .pick h4 { text-align: left; }
.shoot table { width: 100%; border-collapse: collapse; }
.shoot td { padding: .3rem .2rem; border-bottom: 1px solid var(--line); }
.shoot td.w { text-align: right; font-family: var(--mono); letter-spacing: .2em; }
.shoot tr.me td { color: var(--amber); }
.shoot tr.gone td { opacity: .45; }
table.scorecard td { padding: .15rem .25rem; text-align: center; font-variant-numeric: tabular-nums; }
table.scorecard td:first-child { text-align: left; }
table.scorecard td.k { color: var(--dim); font-size: .8rem; }
table.scorecard td.hand { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard", cursive; color: #e8e0c8; }
table.scorecard td.pencil { color: #a9a493; font-style: italic; }
.shoot .took { color: var(--red); font-size: .85rem; }
.pick h3 { margin: .8rem 0 .4rem; }
.pick h4 { margin: .9rem 0 .35rem; color: var(--dim); font-weight: 600;
           font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; }
.pick .choice { padding: .6rem .8rem; font-size: .95rem; }
.pick .choice .k { min-width: 3.2rem; color: var(--dim); font-weight: 400; }
/* The card while the table catches up, and the beat before the placings. */
.card-wait { padding: .6rem .2rem; }
.card-wait .in { font-size: 1.25rem; font-weight: 700; display: flex;
                 justify-content: space-between; align-items: baseline; }
.trivia { margin: 0; padding: 1rem 1.1rem; border-left: 3px solid var(--amber);
          background: var(--panel); border-radius: 0 10px 10px 0;
          font-size: 1.05rem; line-height: 1.5; }
.trivia cite { display: block; margin-top: .6rem; font-style: normal;
               color: var(--dim); font-size: .85rem; font-family: var(--mono); }
.scoring h2 { font-size: 2rem; letter-spacing: .04em; }
.state { text-align: center; padding: 3rem 1rem; color: var(--dim); }
.state h2 { color: var(--text); margin: 0 0 .5rem; }
.verdict { text-align: center; padding: 1.4rem 1rem; border-radius: 12px;
           margin-bottom: 1rem; }
.verdict.right { background: #14301b; border: 1px solid var(--green); }
.verdict.wrong { background: #331a1a; border: 1px solid var(--red); }
.verdict .h { font-size: 1.4rem; font-weight: 700; }
.verdict .t { color: var(--dim); font-size: .9rem; margin-top: .25rem; }
.mine { font-family: var(--mono); font-size: 1.6rem; }
table.board { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.board td { padding: .4rem .3rem; border-bottom: 1px solid var(--line); }
table.board td.n { color: var(--dim); width: 2rem; }
table.board td.ms { text-align: right; font-family: var(--mono);
                    color: var(--dim); }
table.board tr.me td { color: var(--amber); font-weight: 600; }
.join input, .join select { width: 100%; padding: .9rem 1rem; font-size: 1.1rem;
              border-radius: 12px; border: 1px solid var(--line-2);
              background: var(--panel); color: var(--text); }
.err { color: var(--red); margin-top: .8rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tablebar">
    <b>{{ name }}</b>
    <span class="who" id="who"></span>
    <button class="leave" id="leave" hidden>leave</button>
    <span class="roommark" id="roommark" data-class=""><img src="{{ asset('icon.png') }}" alt="ELMER"><span class="credit">made with <b>Claude Code</b></span></span>
  </div>
  <div id="view"><div class="state"><h2>Connecting…</h2></div></div>
</div>
<script src="{{ asset('games.js') }}"></script>
<script src="{{ asset('morse.js') }}"></script>
<script src="{{ asset('hallshow.js') }}"></script>
<script>
const PAGE_BUILD = "{{ build }}";
const TABLE = {{ table|tojson }};
let me = null;              // {id, name, cohort}
let shownRound = null;      // round number currently painted
const PAGE_TABLE_NAME = "{{ name }}";
let paintedAt = 0;          // when this phone actually drew the question
let answered = false;
let myChoice = null;        // which choice this phone tapped, for the reveal
let poll = null;

const view = document.getElementById('view');
/* The game pages do not load elmer.js, so its reporter and toast are not
   here - and a report that throws inside a catch is worse than none. What
   goes wrong on this page goes to data/elmer.log the same way, by beacon,
   which needs no free connection to get out. */
// Ours, unconditionally: the browser has a built-in window.reportError
// that rethrows its argument as an uncaught error, which is the opposite.
window.reportError = function (kind, message, extra) {
  try {
    const body = JSON.stringify(Object.assign({kind, message, page: location.pathname}, extra || {}));
    if (navigator.sendBeacon) navigator.sendBeacon('/api/client-error', new Blob([body], {type: 'application/json'}));
    else fetch('/api/client-error', {method: 'POST', headers: {'Content-Type': 'application/json'}, body, keepalive: true});
  } catch (e) { /* reporting must never itself break the page */ }
};
window.addEventListener('error', e => reportError('js-error', e.message, {line: e.lineno, stack: e.error && e.error.stack}));
window.addEventListener('unhandledrejection', e => { const r = e.reason; reportError('promise-rejection', r && r.message ? r.message : String(r), {stack: r && r.stack}); });
window.toast = window.toast || function (title, text) {
  let el = document.getElementById('page-toast');
  if (!el) { el = document.createElement('div'); el.id = 'page-toast'; el.style.cssText = 'position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#1c2733;color:#e6edf3;border:1px solid #3a4a5a;border-radius:8px;padding:.5rem .9rem;font-size:.9rem;z-index:99;max-width:90vw'; document.body.appendChild(el); }
  el.innerHTML = '<b></b> <span></span>'; el.querySelector('b').textContent = title; el.querySelector('span').textContent = text || '';
  el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 5000);
};
const who = document.getElementById('who');

/* Every call has a deadline and is counted while it is out. A press whose
   request never leaves the browser - the connection pool full, a fetch
   that hangs - used to sit for ever with the button greyed and nothing in
   any log; now it fails at the deadline, and the report says how many
   other requests were in flight and what the narrator's audio was doing,
   which is the one place a page like this can tie the pool up. */
const API_DEADLINE_MS = 12000;
const inflight = new Map();
let apiSerial = 0;
function inflightWords() {
  const now = performance.now();
  const rows = Array.from(inflight.values()).map(r => r.path + ' ' + Math.round(now - r.at) + 'ms');
  const audio = window.Voice && Voice.pending ? Voice.pending() : null;
  return rows.length + ' in flight' + (rows.length ? ' [' + rows.join(', ') + ']' : '') +
    (audio ? '; audio: ' + audio : '');
}
async function api(path, body) {
  const opt = body ? {method: 'POST', headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify(body)} : {};
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  if (ctl) opt.signal = ctl.signal;
  const id = ++apiSerial;
  inflight.set(id, {path: path.split('?')[0], at: performance.now()});
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, API_DEADLINE_MS);
  try {
    const r = await fetch(path, opt);
    return {ok: r.ok, status: r.status, data: await r.json().catch(() => ({}))};
  } catch (err) {
    const aborted = err && err.name === 'AbortError';
    reportError(aborted ? 'deadline' : 'network',
                (aborted ? 'no answer in ' + API_DEADLINE_MS + ' ms from ' : 'fetch failed for ') + path.split('?')[0] +
                (aborted ? '' : ': ' + err.message) + ' - ' + inflightWords());
    throw err;
  } finally {
    clearTimeout(timer);
    inflight.delete(id);
  }
}

/* ---------------------------------------------------------------- joining */
/* Two names, kept apart. The first is what the room sees - on the table
   screen, on the big board, on everybody else's phone - and it can be
   anything, because one never knows who is wandering about a hamfest. The
   second is what goes on a certificate if they win one, and nobody sees it
   until it is printed. Most people will type the same thing twice or leave
   the second blank; the ones who want the alias have it. */
function showJoin(reason) {
  view.innerHTML = `
    <div class="join">
      <p class="big">What should we call you?</p>
      <input id="nm" maxlength="24" autocomplete="off" autocapitalize="words" list="regulars"
             placeholder="A name, a callsign, or an alias">
      <datalist id="regulars"></datalist>
      <p class="tiny muted" style="margin:.3rem 0 .9rem">This is what the room sees. Play under whatever you like.</p>
      <p class="small" style="margin:0 0 .3rem">The name or callsign you want on any certificate won today</p>
      <input id="cert" maxlength="48" autocomplete="off" autocapitalize="words"
             placeholder="Leave blank to use the name above">
      <p class="tiny muted" style="margin:.3rem 0 0">Only ever printed, never shown.</p>
      <p class="small" style="margin:.9rem 0 .3rem">License class you hold, if you care to say</p>
      <select id="lic">
        <option value="">Rather not say</option>
        <option value="none">None yet</option>
        <option value="Technician">Technician</option>
        <option value="General">General</option>
        <option value="Extra">Extra</option>
        <option value="Advanced">Advanced</option>
        <option value="Novice">Novice</option>
      </select>
      <p class="tiny muted" style="margin:.3rem 0 0">Kept apart from your name, for the class report: how the material holds up across license classes. It changes nothing about how you play.</p>
      <button class="btn primary wide" id="go" style="margin-top:1rem">Join this table</button>
      ${reason ? `<div class="err">${reason}</div>` : ''}
    </div>`;
  const nm = document.getElementById('nm');
  const cert = document.getElementById('cert');
  const lic = document.getElementById('lic');
  const go = document.getElementById('go');
  const saved = localStorage.getItem('elmer_party_name');
  if (saved) nm.value = saved;
  const savedCert = localStorage.getItem('elmer_party_cert_name');
  if (savedCert) cert.value = savedCert;
  const savedLic = localStorage.getItem('elmer_party_license');
  if (savedLic) lic.value = savedLic;
  nm.focus();
  const join = async () => {
    const name = nm.value.trim();
    const cert_name = cert.value.trim();
    const license = lic.value;
    if (!name) { nm.focus(); return; }
    go.disabled = true; go.textContent = 'Joining…';
    localStorage.setItem('elmer_party_name', name);
    if (cert_name) localStorage.setItem('elmer_party_cert_name', cert_name);
    else localStorage.removeItem('elmer_party_cert_name');
    if (license) localStorage.setItem('elmer_party_license', license);
    else localStorage.removeItem('elmer_party_license');
    // Who this phone was last time, if the table still has them: a reload
    // in a new tab is the same person, not a second one.
    let previous = null;
    try { const was = JSON.parse(localStorage.getItem('elmer_party_was') || 'null');
          if (was && was.name && was.name.toLowerCase() === name.toLowerCase()) previous = was.id; } catch (e) {}
    const r = await api('/api/party/join', {name, cert_name, previous, license, build: PAGE_BUILD});
    if (!r.data.joined) {
      // Told this page is stale: fetch the current one rather than making
      // the person read the instruction and do it themselves.
      if (r.data.stale) { location.reload(); return; }
      showJoin(r.data.reason || 'Could not join.'); return;
    }
    me = r.data.player;
    sessionStorage.setItem('elmer_party_player', JSON.stringify(me));
    try { localStorage.setItem('elmer_party_was', JSON.stringify({id: me.id, name: me.name})); } catch (e) {}
    who.textContent = me.name + ' · Cohort ' + me.cohort;
    leaveBtn.hidden = false;
    start();
  };
  go.addEventListener('click', join);
  nm.addEventListener('keydown', e => { if (e.key === 'Enter') cert.focus(); });
  cert.addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
}

/* ----------------------------------------------------------------- rounds */
/* Waiting used to be all this screen could say, and on a table nobody was
   running it said it for ever. Now it says what it is waiting for: a
   countdown that is already going to fire, or - for somebody sitting here on
   their own - a press. The server checks that permission again when the press
   arrives; this only decides whether to offer it. */
/* A hall shootout, from a phone at one of its tables. The pick is the
   table's; when it is this table's, the subjects are here and anyone at the
   table may tap - the first tap is the table's choice. Otherwise: whose it
   is, and the tables' letters. */
/* The hall's CutThroat or golf, as it concerns this table, in a line. */
function hallGameLine(hall, esc_) {
  const e = esc_ || escapeHTML;
  if (!hall) return '';
  const ct = hall.cutthroat, gf = hall.golf;
  if (ct && ct.on) {
    if (ct.over) return `CutThroat across the hall: <b>${e(ct.winner_name || 'a table')}</b> is the last table standing.`;
    const you = ct.you_in === false ? 'this table is out - watching' : ct.you_in ? 'this table is in' : '';
    const where = ct.phase === 'final' ? `the final, question ${(ct.final_round || 0) + 1} of ${ct.final_length}`
      : ct.phase === 'sudden' ? 'sudden death' : `${ct.remaining} of ${ct.players} tables in`;
    return `CutThroat across the hall: ${where}${you ? ' · ' + you : ''}. A table is right when anybody at it is.`;
  }
  if (gf && gf.on) {
    if (gf.over) return `Golf across the hall: <b>${e(gf.winner_name || 'a table')}</b> wins the round.`;
    const you = gf.you ? ` · this table's ball: ${gf.you.holed ? 'holed in ' + gf.you.strokes : gf.you.picked_up ? 'picked up' : gf.you.left + ' to go, ' + e(gf.you.lie)}` : '';
    return `Golf across the hall at ${e(gf.course_name)}: hole ${Math.min(gf.holes_played + 1, gf.holes)} of ${gf.holes}, par ${gf.par}${you}. A scramble - one ball a table, right if anybody at it is.`;
  }
  return '';
}

function paintHallShootout(state) {
  const h = state.hall && state.hall.shootout;
  if (!h || !h.on) return false;
  const standing = (h.standing || []).map(r => `
    <tr class="${r.name === (state.hall.table || '') ? 'me' : ''} ${r.out ? 'gone' : ''}">
      <td>${escapeHTML(r.name)}${r.picking && !h.over ? ' · picking' : ''}${r.simulated ? ' <span class="took" style="color:var(--dim)">practice</span>' : ''}</td>
      <td class="w">${wordHTML(r)}</td></tr>`).join('');
  let body;
  if (h.over) {
    body = `<p style="padding:1rem 0">${h.drawn ? 'Out of subjects with nobody ahead: a draw.' : escapeHTML(h.winner_name || 'A table') + ' is the last table standing.'}</p>`;
  } else if (h.your_pick) {
    let group = null, out = '';
    (h.available || []).forEach(a => {
      if (a.group !== group) { group = a.group; out += `<h4>${escapeHTML(a.group)}${a.group_title ? ' · ' + escapeHTML(a.group_title) : ''}</h4>`; }
      out += `<button class="choice" data-hall-section="${escapeHTML(a.section)}"><span class="k">${escapeHTML(a.section)}</span>${escapeHTML(a.title)}</button>`;
    });
    body = `<div class="pick"><h3>Your table has the pick. <span class="clock" id="hallpickleft"></span></h3>
      <p class="tiny muted" style="margin:0 0 .5rem">Anyone at this table can choose the subject for the whole hall. The first tap is the table's choice.</p>${out}</div>`;
  } else if (h.pick) {
    body = `<p style="padding:1rem 0">${escapeHTML(h.picker_name || 'The picking table')} chose ${escapeHTML(h.pick_title || h.pick)}. Next question coming…</p>`;
  } else {
    body = `<p style="padding:1rem 0">Waiting for ${escapeHTML(h.picker_name || 'another table')} to choose the subject… <span class="clock" id="hallpickleft"></span></p>`;
  }
  view.innerHTML = `<div class="state" style="padding:1rem .2rem"><h2>Shootout across the hall</h2>
    <div class="shoot"><table>${standing}</table></div>${body}</div>`;
  wireHallPick();
  return true;
}

/* The same pick, under a round's result: the result stays, and the hall's
   next move sits beneath it. */
function hallPickHTML(state) {
  const h = state.hall && state.hall.shootout;
  if (!h || !h.on) return '';
  if (h.over) return `<p class="state" style="padding:1rem 0">${h.drawn ? 'Out of subjects with nobody ahead: a draw.' : escapeHTML(h.winner_name || 'A table') + ' is the last table standing.'}</p>`;
  if (h.your_pick) {
    let group = null, out = '';
    (h.available || []).forEach(a => {
      if (a.group !== group) { group = a.group; out += `<h4>${escapeHTML(a.group)}${a.group_title ? ' · ' + escapeHTML(a.group_title) : ''}</h4>`; }
      out += `<button class="choice" data-hall-section="${escapeHTML(a.section)}"><span class="k">${escapeHTML(a.section)}</span>${escapeHTML(a.title)}</button>`;
    });
    return `<div class="pick"><h3>Your table has the pick. <span class="clock" id="hallpickleft"></span></h3>
      <p class="tiny muted" style="margin:0 0 .5rem">Anyone at this table can choose the subject for the whole hall. The first tap is the table's choice.</p>${out}</div>`;
  }
  if (h.pick) return `<p class="state" style="padding:1rem 0">${escapeHTML(h.picker_name || 'The picking table')} chose ${escapeHTML(h.pick_title || h.pick)}. Next question coming…</p>`;
  return `<p class="state" style="padding:1rem 0">Waiting for ${escapeHTML(h.picker_name || 'another table')} to choose the subject… <span class="clock" id="hallpickleft"></span></p>`;
}

function wireHallPick() {
  document.querySelectorAll('[data-hall-section]').forEach(b => b.addEventListener('click', async () => {
    document.querySelectorAll('[data-hall-section]').forEach(x => { x.disabled = true; });
    b.classList.add('picked');
    const r = await api('/api/party/net/pick', {section: b.dataset.hallSection});
    if (r.status !== 200) { document.querySelectorAll('[data-hall-section]').forEach(x => { x.disabled = false; }); b.classList.remove('picked'); }
  }));
}

function paintHallPickClock(state) {
  const el = document.getElementById('hallpickleft');
  const h = state.hall && state.hall.shootout;
  if (!el || !h) return;
  const left = h.pick_remaining;
  el.textContent = (left === null || left === undefined) ? '' : Math.ceil(left) + 's';
}

function paintWaiting(state) {
  const n = (state.cohorts || []).reduce((a, c) => a + c.players, 0);
  const secs = state.starts_in;
  const soon = secs !== null && secs !== undefined;
  if (paintHallShootout(state)) return;
  const hallGame = hallGameLine(state.hall);
  if (hallGame) {
    view.innerHTML = `<div class="state" style="padding:1rem .2rem"><h2>${state.hall.cutthroat && state.hall.cutthroat.on ? 'CutThroat' : 'Golf'} across the hall</h2>
      <p>${hallGame}</p><p style="padding:1rem 0;color:var(--dim)">Waiting for the hall's next question.</p></div>`;
    return;
  }
  const standing = state.standing;
  if (standing && !state.golf && !state.clubhouse && !state.baseball) {
    const gname = GAME_NAMES[standing.mode] || standing.mode;
    view.innerHTML = `<div class="state" style="padding:1rem .2rem;text-align:left">
        <h2 style="margin:0 0 .4rem">${standing.mode === 'golf' ? 'Golf at ' + escapeHTML(standing.course_name || 'the course') : escapeHTML(gname)}</h2>
        <p>The table is set for ${escapeHTML(gname.toLowerCase())}. It starts the moment somebody checks in.</p>
        ${gamesGuideHTML(standing.mode)}</div>`;
    return;
  }
  const club = state.clubhouse;
  if (club) {
    const secs = Math.max(0, Math.ceil(club.tee_in));
    view.innerHTML = `<div class="state" style="padding:1rem .2rem;text-align:left">
        ${club.backdrop ? `<img src="/static/golf/clubhouse/${escapeHTML(club.backdrop)}.jpg" alt="" style="width:100%;border-radius:10px;display:block;margin-bottom:.6rem">` : ''}
        <h2 style="margin:0 0 .4rem">The clubhouse${club.course_name ? ' &middot; ' + escapeHTML(club.course_name) : ''}</h2>
        <p>Tee time in <b>${secs >= 60 ? Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0') : secs + 's'}</b> &middot; ${club.people.length} of ${club.foursome} in the group${club.people.length ? ': ' + club.people.map(escapeHTML).join(', ') : ''}.</p>
        <p class="tiny muted">The group departs when it is full, when the time is up, or when somebody at the table says play now. Practice players make up the rest.</p>
        <p><button class="choice" id="tee-off" style="text-align:center"><b>Play now &rsaquo;</b></button></p>
        <p><button class="choice" id="proshop-open" style="text-align:center">The pro shop &rsaquo;</button></p>
        <div id="proshop-phone" hidden></div></div>`;
    const b = document.getElementById('tee-off');
    if (b) b.addEventListener('click', async () => { b.disabled = true; await api('/api/party/tee-off', {}); });
    const ps = document.getElementById('proshop-open');
    if (ps) ps.addEventListener('click', async () => {
      const box = document.getElementById('proshop-phone');
      if (!box.hidden) { box.hidden = true; return; }
      let d;
      try { const r = await api('/api/golf/proshop'); d = r.data || r; } catch (e) { return; }
      box.innerHTML = `<h3 style="margin:.6rem 0 .3rem">${d.whose ? escapeHTML(d.whose) + "'s wall" : 'The wall'}</h3>` +
        (d.wall || []).map(a => `<figure style="margin:0 0 .8rem;padding:.4rem;background:#1b1f27;border:4px solid #3a2f1c;border-radius:3px">
          <img src="${escapeHTML(a.url)}" alt="${escapeHTML(a.title)}" style="width:100%;height:auto;display:block" loading="lazy">
          <figcaption class="tiny" style="margin-top:.3rem"><b>${escapeHTML(a.title)}</b>${a.detail ? '<br>' + escapeHTML(a.detail) : ''}${a.issued ? '<br><span class="muted">' + escapeHTML(a.issued) + '</span>' : ''}</figcaption></figure>`).join('') +
        ((d.records || []).length ? `<h3 style="margin:.6rem 0 .3rem">Record board</h3><table class="board">${d.records.slice(0, 10).map(r =>
          `<tr><td>${escapeHTML(r.name)}</td><td class="ms">${r.rounds} rd</td><td class="ms">${r.best_to_par > 0 ? '+' + r.best_to_par : r.best_to_par === 0 ? 'E' : r.best_to_par}</td></tr>`).join('')}</table>` : '');
      box.hidden = false;
      // The clubhouse repaints on its key; keep the shop open across it.
      shownRound = 'proshop';
    });
    return;
  }
  const gf = state.golf;
  if (gf) {
    view.innerHTML = `<div class="state" style="padding:1rem .2rem;text-align:left">
        <h2 style="margin:0 0 .4rem">Golf</h2>${golfHeadHTML(gf)}${golfTurnHTML(gf)}
        ${gf.over ? `<p><b>${escapeHTML(gf.winner_name || 'Somebody')}</b> wins the round.</p>` : golfClubsHTML(gf)}
        ${gf.your_turn && gf.address_waits && !gf.over ? `<p><button class="choice" id="golf-hit" style="text-align:center"><b>Hit &rsaquo;</b></button></p>` : ''}
        ${golfPlaybackHTML(gf)}
        <h3 style="margin:.8rem 0 .3rem">The card</h3>${golfBoardHTML(gf)}
        ${gf.you && gf.you.log && gf.you.log.length ? `<h3 style="margin:.8rem 0 .3rem">Your strokes this hole</h3><ol class="tiny" style="margin:0;padding-left:1.2rem">${gf.you.log.map(l => `<li>${escapeHTML(l)}</li>`).join('')}</ol>` : ''}</div>`;
    wireClubs();
    const hb = document.getElementById('golf-hit');
    if (hb) hb.addEventListener('click', async () => { hb.disabled = true; await api('/api/party/hit', {player: me.id}); tick(); });
    return;
  }
  const bb = state.baseball;
  if (bb) {
    paintBaseballPhone(bb);
    return;
  }
  const ct = state.cutthroat;
  if (ct) {
    // A CutThroat between questions: who is still in, and where it is.
    const rows = (ct.standing || []).map(r =>
      `<tr><td class="n">${r.place}</td><td>${escapeHTML(r.name)}${r.bot ? ' <span class="clock">bot</span>' : ''}</td>
           <td class="ms">${r.in ? (ct.phase === 'final' || ct.phase === 'sudden' ? (r.final_correct || 0) + ' right' : 'in')
                                 : 'out r' + r.out_round}</td></tr>`).join('');
    view.innerHTML = `<div class="state" style="padding:1rem .2rem">
        <h2>CutThroat</h2><p>${cutLine(ct, true)}</p>
        <table class="res" style="margin-top:.6rem;width:100%">${rows}</table>
        ${ct.over ? '' : '<p style="padding:1rem 0;color:var(--dim)">Waiting for the next question.</p>'}</div>`;
    return;
  }
  const shoot = state.shootout;
  if (shoot) {
    // A shootout between questions: the word so far, and either the pick
    // or who is being waited on for it.
    view.innerHTML = `<div class="state" style="padding:1rem .2rem">
        <h2>Shootout</h2>${paintShootout(shoot)}
        ${shoot.your_pick ? paintPick(shoot)
          : `<p style="padding:1rem 0">${waitingLine(shoot)}</p>`}</div>`;
    wirePick();
    return;
  }
  /* Between rounds in a hall the phone shows the same card the room is
     looking at - a person holding a screen with nothing to do but read it
     is the one moment a sponsor or a fact gets read. */
  view.innerHTML = `<div class="state">
      <h2>You're in.</h2>
      ${soon
        ? `<p>Starting in <b>${Math.ceil(secs)}</b>&hellip;</p>`
        : (state.may_start
            ? `<p>Nobody else is here, so it is yours to begin.</p>
               <button class="btn primary" id="startnow">Start</button>`
            : `<p>Waiting for the next question.</p>`)}
      <p class="clock">${n} player${n === 1 ? '' : 's'} at this table</p>
      ${!soon ? hallCardHTML(state) : ''}
      <div style="text-align:left">${gamesGuideHTML(state.mode || 'tournament')}</div>
    </div>`;
  const go = document.getElementById('startnow');
  if (go) go.addEventListener('click', async () => {
    go.disabled = true;
    go.textContent = 'Starting\u2026';
    try {
      await api('/api/party/start-now', {});
    } catch (err) {
      go.disabled = false;
      go.textContent = 'Start';
    }
  });
}

/* Golf, on a phone. Before each question the club, chosen here and sent
   the moment it is tapped; the sensible one is lit until then and is what
   the stroke gets if the clock on choosing runs out. After, the playback:
   this player's stroke first, then the table's. Between, the card. */
function golfHeadHTML(gf) {
  const you = gf.you;
  const onTheTee = Object.values(gf.balls || {}).every(b => b.strokes === 0);
  const myAim = you && you.aim;
  const mapKey = 'm' + gf.hole + (gf.last || []).length + Object.values(gf.balls || {}).map(b => b.at + ':' + b.off).join(',') +
                 (myAim && myAim.set ? 'a' + myAim.at + ':' + myAim.off : '');
  // The strip takes a tap: where this golfer means the ball to land. Their
  // own ball, any time before the stroke; not on the green - that is a putt.
  const canAim = you && !you.holed && !you.picked_up && !gf.over;
  const standings = onTheTee && gf.holes_played > 0 && !gf.over
    ? `<p class="clock" style="margin:0 0 .3rem">Standings after the ${ordinal(gf.holes_played)}</p><table class="board" style="margin-bottom:.6rem">${(gf.leaderboard || []).map(r =>
        `<tr class="${r.player === me.id ? 'me' : ''}"><td class="n">${r.place}</td><td>${escapeHTML(r.name)}</td><td class="ms">${r.gross}</td><td class="ms">${r.to_par > 0 ? '+' + r.to_par : r.to_par === 0 ? 'E' : r.to_par}</td></tr>`).join('')}</table>` +
      (gf.away_name ? `<p style="margin:0 0 .6rem"><b>${escapeHTML(gf.away_name)}</b> has the honour on the ${ordinal(gf.hole)}.</p>` : '')
    : '';
  return standings + (onTheTee && gf.tee_pic && !gf.over
      ? `<img src="${escapeHTML(gf.tee_pic)}" alt="" style="width:100%;border-radius:10px;display:block;margin-bottom:.5rem">` : '') +
    (!gf.over ? `<img id="holemap" src="/api/party/golf/map.svg?player=${me.id}&k=${encodeURIComponent(mapKey)}" alt="the hole" style="float:right;width:${canAim ? '8rem' : '6.5rem'};height:auto;border-radius:8px;margin:0 0 .4rem .6rem${canAim ? ';outline:2px solid var(--amber);outline-offset:2px' : ''}"${canAim ? ' data-aim-for="' + me.id + '"' : ''}>` : '') +
    (canAim ? `<p class="tiny muted" style="margin:0 0 .4rem">${myAim && myAim.set ? (you.lie === 'green' ? `Aiming ${Math.abs(Math.round((myAim.at - gf.yards) * 3))} ft ${(myAim.at - gf.yards) < 0 ? 'short of' : 'past'} the cup${myAim.off ? ', ' + Math.abs(Math.round(myAim.off * 3)) + ' ft ' + (myAim.off < 0 ? 'left' : 'right') : ''}. ` : `Aiming ${myAim.at} yards${myAim.off ? ', ' + Math.abs(myAim.off) + (myAim.off < 0 ? ' left' : ' right') : ''}. `) : ''}${you.lie === 'green' ? 'Tap the green where you mean the putt to die' : 'Tap the hole to set your mark'}${myAim && myAim.set ? ', or <a href="#" id="aim-clear">aim at the ' + (you.lie === 'green' ? 'cup' : 'pin') + '</a>' : ''}.</p>` : '') +
    `<p class="clock" style="margin:0 0 .3rem">${escapeHTML(gf.course_name)} &middot; ${ordinal(gf.hole)}${gf.hole_name ? ' ' + escapeHTML(gf.hole_name) : ''}
    &middot; par ${gf.par} &middot; ${gf.yards} yd &middot; ${gf.wind_mph} mph ${escapeHTML(gf.hole_wind || '')}${(gf.day && (gf.day.sky_words || gf.day.ground_words)) ? ' &middot; ' + [gf.day.sky_words, gf.day.ground_words].filter(Boolean).map(escapeHTML).join(', ') : ''}</p>` +
    (you ? `<p style="margin:0 0 .6rem"><b>${you.holed ? 'Holed in ' + you.strokes : you.picked_up ? 'Picked up' : you.lie === 'green' ? you.feet + ' feet' : you.left + ' to go'}</b>
      ${you.holed || you.picked_up ? '' : `&middot; ${escapeHTML(you.lie)} &middot; ${you.strokes} played`}</p>` : '');
}
/* Whose stroke it is, in a line: golf is played one at a time, and nobody
   is on a clock. */
function golfTurnHTML(gf) {
  if (gf.over) return '';
  if (gf.away_name && !gf.your_turn && !gf.your_tee_time) return `<p style="margin:0 0 .5rem"><b>${escapeHTML(gf.away_name)}</b> addresses the ball${gf.away_club ? ', the ' + escapeHTML(gf.away_club) + ' in hand' : ''}&hellip; The question comes up in a moment; read it with them.</p>`;
  if (gf.your_tee_time) return `<p style="margin:0 0 .5rem"><b>You have a tee time.</b> The group picks you up ${gf.next_hole ? 'at the ' + gf.next_hole + ordinal(gf.next_hole) : 'at the next hole'}; watch this one with them - the questions are worth reading.</p>`;
  if (gf.your_turn) return `<p style="margin:0 0 .5rem"><b>Your stroke.</b> ${gf.address_waits ? 'Choose a club, then press Hit - the question comes when you are ready.' : 'Take your time.'}</p>`;
  if (gf.away_name) return `<p style="margin:0 0 .5rem;color:var(--dim)"><b>${escapeHTML(gf.away_name)}</b> is away &middot; ${gf.away_lie === 'green' ? (gf.away_feet || 0) + ' feet, on the green' : gf.away_left + ' to go, ' + escapeHTML(gf.away_lie || '')}${gf.away_club ? ' &middot; the ' + escapeHTML(gf.away_club) : ''}.<br>Read the question with them; the next one is yours.</p>`;
  return '';
}
function golfClubsHTML(gf) {
  const you = gf.you;
  if (!you || !you.clubs || !you.clubs.length || you.holed || you.picked_up) return '';
  const chosen = gf.your_club || you.default_club;
  return `<div class="pick" style="margin:.4rem 0">
    <h3 style="margin:0 0 .4rem">Your club</h3>
    <div id="clubs">${you.clubs.map(c => `<button class="choice club ${c === chosen ? 'picked' : ''}" data-club="${c}">
      <span class="k">${c === 'putter' ? '&#9971;' : c[0].toUpperCase()}</span>${c}${c === you.default_club ? ' <span class="clock">sensible</span>' : ''}</button>`).join('')}</div></div>`;
}
function wireClubs() {
  document.querySelectorAll('#clubs .club').forEach(b => b.addEventListener('click', async () => {
    document.querySelectorAll('#clubs .club').forEach(x => x.classList.toggle('picked', x === b));
    const r = await api('/api/party/club', {player: me.id, club: b.dataset.club});
    if (!r.ok && r.data && r.data.message) { b.classList.remove('picked'); }
  }));
}
function golfPlaybackHTML(gf) {
  if (!gf.last || !gf.last.length) return '';
  const mine = gf.last.find(s => s.player === me.id);
  const others = gf.last.filter(s => s.player !== me.id);
  return `${mine ? `<div class="verdict ${mine.holed ? 'right' : mine.kind === 'water' || mine.kind === 'missed' || mine.kind === 'sand' ? 'wrong' : 'in'}">
      <div class="h">${escapeHTML(mine.call || mine.words)}</div>${
        mine.kind && (gf.clips || []).includes(mine.kind) ? `<img src="/static/golf/clips/${escapeHTML(mine.kind)}.gif" alt="" style="max-width:100%;max-height:7rem;display:block;margin:.3rem auto;border-radius:8px">` : ''}
      <div class="t">${escapeHTML(mine.words)}</div></div>` : ''}
    <table class="board">${others.map(s => `<tr><td>${escapeHTML(s.name)}</td><td>${s.call ? '<b>' + escapeHTML(s.call) + '</b> ' : ''}${escapeHTML(s.words)}</td></tr>`).join('')}</table>`;
}
function strokeCell(card, n, ball, hole) {
  const s = (card || [])[String(n)];
  if (s != null) return `<td class="ms hand">${s}</td>`;
  if (n === hole && ball && ball.strokes) return `<td class="ms hand pencil">${ball.strokes}</td>`;
  return '<td class="ms"></td>';
}
/* Every stroke of yours, hole by hole, under the card - one line a stroke,
   the tap-in included - so the number on the card can always be counted.
   Folded by default; a press opens it. */
let myHistoryOpen = false;
function golfMyHistory(gf) {
  const logs = (gf.logs || {})[me.id];
  const row = (gf.leaderboard || []).find(r => r.player === me.id);
  if (!logs || !Object.keys(logs).length) return '';
  const holes = (gf.round_holes || []).filter(h => logs[String(h.n)]);
  return `<details class="tiny" style="margin-top:.4rem"${myHistoryOpen ? ' open' : ''} id="my-history"><summary>Your strokes, hole by hole</summary>` +
    holes.map(h => { const n = (row && row.card && row.card[String(h.n)]) || (h.n === gf.hole && gf.you ? gf.you.strokes : logs[String(h.n)].length);
      return `<div style="margin-top:.3rem"><b>${h.n}${ordinal(h.n)}, par ${h.par}</b> &middot; ${n} stroke${n === 1 ? '' : 's'}${h.n === gf.hole && !(row && row.card && row.card[String(h.n)]) ? ' so far' : ''}<ol style="margin:.1rem 0 0;padding-left:1.2rem">${logs[String(h.n)].map(l => `<li>${escapeHTML(l)}</li>`).join('')}</ol></div>`; }).join('') +
    `<p class="muted" style="margin:.4rem 0 0">One line a stroke; a penalty is a stroke on top of its line; a pick-up is written as par plus three.</p></details>`;
}
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'my-history') myHistoryOpen = e.target.open; }, true);
function golfBoardHTML(gf) {
  const holes = gf.round_holes || [];
  if (holes.length) {
    const rows = (gf.leaderboard || []).map(r =>
      `<tr class="${r.player === me.id ? 'me' : ''}"><td>${escapeHTML(r.name)}</td>${holes.map(h => strokeCell(r.card, h.n, (gf.balls || [])[r.player], gf.hole)).join('')}<td class="ms"><b>${r.gross}</b></td><td class="ms">${
        r.to_par > 0 ? '+' + r.to_par : r.to_par === 0 ? 'E' : r.to_par}</td></tr>`);
    return `<div style="overflow-x:auto"><table class="board scorecard"><tr><td class="k">hole</td>${holes.map(h => `<td class="ms">${h.n}</td>`).join('')}<td class="ms">tot</td><td class="ms">&plusmn;</td></tr>
      <tr><td class="k">par</td>${holes.map(h => `<td class="ms">${h.par}</td>`).join('')}<td class="ms">${holes.reduce((a, h) => a + h.par, 0)}</td><td></td></tr>${rows.join('')}</table></div>` +
      golfMyHistory(gf);
  }
  return `<table class="board">${(gf.leaderboard || []).map(r =>
    `<tr class="${r.player === me.id ? 'me' : ''}"><td class="n">${r.place}</td><td>${escapeHTML(r.name)}</td>
     <td class="ms">${r.holes} holes</td><td class="ms">${gf.handicaps ? r.net + ' net' : r.gross}</td>
     <td class="ms">${r.to_par > 0 ? '+' + r.to_par : r.to_par === 0 ? 'E' : r.to_par}</td></tr>`).join('')}</table>`;
}

/* CutThroat, on a phone: whether this player is still in, and where the
   game is. The seated see every question and the reveal - they just have
   no buttons that count, and are told so rather than left to press. */
function cutLine(ct, mine) {
  if (!ct) return '';
  if (ct.over) return `<b>${escapeHTML(ct.winner_name || 'Somebody')}</b> wins the CutThroat.`;
  const where = ct.phase === 'final'
      ? `Final: question ${(ct.final_round || 0) + 1} of ${ct.final_length}`
      : ct.phase === 'sudden' ? 'Sudden death: one right wins; both right, the faster'
      : `${ct.remaining} of ${ct.players} still in`;
  const you = mine ? (ct.you_in ? '' : ` &middot; You went out in round ${ct.you_out_round}; watch the rest.`) : '';
  return where + you;
}

function paintQuestion(round, ct, gf) {
  const q = round.question || {};
  answered = false;
  paintedAt = performance.now();     // the clock the race is actually timed on
  // Out of a CutThroat, or watching somebody else's stroke: the question
  // is there to read, and no button on it counts.
  const watching = !!(gf && !gf.your_turn);
  const seated = !!(ct && !ct.you_in) || watching;
  const choices = (q.choices || []).map((c, i) =>
    `<button class="choice" data-i="${i}"${seated ? ' disabled' : ''}>
       <span class="k">${'ABCD'[i]}</span>${escapeHTML(c)}</button>`).join('');
  view.innerHTML = `
    <div style="display:flex;gap:.6rem;align-items:baseline;margin-bottom:.6rem">
      <span class="clock">Q${round.number}</span>
      <span class="clock" style="color:var(--dimmer)">${escapeHTML(q.section || '')}</span>
      ${gf ? '' : '<span class="clock" id="left" style="margin-left:auto"></span>'}
    </div>
    ${ct ? `<p class="clock" style="margin:-.2rem 0 .6rem;color:${seated ? 'var(--amber)' : 'var(--dim)'}">${seated ? 'CutThroat &middot; you are out - watching. ' : 'CutThroat &middot; '}${cutLine(ct, false)}</p>` : ''}
    <p class="big">${escapeHTML(q.text || '')}</p>
    ${figureBlock(q, {size: 'small'})}
    <div id="choices">${choices}</div>
    ${gf ? (gf.your_turn
        ? '<p style="margin:.8rem 0 .5rem"><b>Your stroke.</b> Take your time - nothing here is timed.</p>' + golfClubsHTML(gf)
        : `<p style="margin:.8rem 0 .5rem;color:var(--amber)"><b>${escapeHTML(gf.away_name || 'Somebody')}</b> is away${gf.away_club ? ' with the ' + escapeHTML(gf.away_club) : ''}. Read it with them - what would you play?</p>`) : ''}
    ${gf ? `<p class="clock" style="margin:0 0 .6rem;color:var(--dim)">Golf &middot; ${ordinal(gf.hole)}, par ${gf.par}${gf.you ? (gf.you.lie === 'green' ? ` &middot; ${gf.you.feet} feet, on the green` : ` &middot; ${gf.you.left} to go, ${escapeHTML(gf.you.lie)}`) : ''}</p>` : ''}`;
  if (gf && gf.your_turn) wireClubs();
  if (seated) { answered = true; return; }
  document.querySelectorAll('.choice').forEach(b => {
    b.addEventListener('click', () => send(parseInt(b.dataset.i, 10), b));
  });
}

async function send(index, button) {
  if (answered) return;
  answered = true;
  // The interval this phone measured, from painting the question to the tap.
  // Network time is deliberately not in it - that is the whole point.
  const ms = Math.round(performance.now() - paintedAt);
  myChoice = index;
  document.querySelectorAll('.choice').forEach(b => { b.disabled = true; });
  button.classList.add('picked');
  const r = await api('/api/party/answer', {player: me.id, chosen: index, ms});
  if (!r.data.accepted) {
    answered = false;
    document.querySelectorAll('.choice').forEach(b => { b.disabled = false; });
    button.classList.remove('picked');
    return;
  }
  // In: the question is done with, so the screen has something else to say
  // while the rest of the table catches up.
  paintCard(currentRound);
}

/* ----------------------------------------------------- the wait, filled */
/* Somebody who has answered used to sit looking at their greyed-out choices
   until the round closed. That is dead time, and it is the one moment in the
   evening a person is holding a screen with nothing to do but read it - so
   they get a card: a little of the history of the art, which the exam never
   asks and which is why most people who stay in the hobby stayed. Not exam
   material, on purpose: the exam is what the game is already made of. */
let currentRound = null;
api('/api/party/regulars').then(r => { const d = r.data || r; const dl = document.getElementById('regulars'); if (dl) dl.innerHTML = (d.regulars || []).map(n => `<option value="${escapeHTML(n)}">`).join(''); }).catch(() => {});
let closedSeenAt = null;
const revealBeat = {};
const SCORING_MS = 3000;

function paintCard(round) {
  const card = (round && round.card) || {};
  view.innerHTML = `<div class="card-wait">
      <div class="in">You\u2019re in <span class="clock" id="left"></span></div>
      <p class="tiny muted" style="margin:.2rem 0 1rem">Waiting on the rest of the table.</p>
      <blockquote class="trivia">${escapeHTML(card.text || '')}
        <cite>${escapeHTML(card.about || '')}</cite></blockquote>
    </div>`;
}

/* Three seconds of "Scoring" before the placings come up. It gives the
   result a beat to land on, and it means the reveal arrives the same way
   whether the round closed on the clock or because everybody was quick. */
function paintScoring() {
  view.innerHTML = `<div class="state scoring"><h2>Scoring\u2026</h2>
      <p>Placing everyone at this table.</p></div>`;
}

/* In a shootout the verdict is about letters, not points: whether the shot
   was made, and whether you are paying for it. The tournament's card -
   "1st on this table, 10 points" - is true and beside the point. */
function shootVerdict(mine, shoot) {
  const last = shoot.last_shot || {};     // the shot this round was, not a pass since
  const iPicked = last.picker === me.id;
  const took = (last.took || []).includes(me.id);
  const ms = mine ? `<div class="mine">${(mine.ms / 1000).toFixed(2)}s</div>` : '';
  if (iPicked) {
    return last.made
      ? `<div class="verdict right"><div class="h">You made it</div>${ms}
           <div class="t">${(last.took || []).length
             ? escapeHTML(whoTook(shoot, last.took)) + ' took a letter · you keep the pick'
             : 'Everybody matched it · you keep the pick'}</div></div>`
      : `<div class="verdict wrong"><div class="h">Missed</div>${ms}
           <div class="t">Your shot, so nobody takes a letter · the pick moves on</div></div>`;
  }
  if (mine && mine.correct) {
    return `<div class="verdict right"><div class="h">Safe</div>${ms}
      <div class="t">${last.made ? 'You matched the picker' : 'Right, and the picker missed'}</div></div>`;
  }
  const word = ((shoot.standing || []).find(r => r.player === me.id) || {}).word || '';
  if (took) {
    return `<div class="verdict wrong"><div class="h">A letter for you</div>${ms}
      <div class="t">The picker made it and you did not · ${escapeHTML(word)}</div></div>`;
  }
  return `<div class="verdict wrong"><div class="h">${mine ? 'Not this time' : 'No answer'}</div>${ms}
    <div class="t">But the picker missed too, so no letter</div></div>`;
}

function paintResults(round, shoot) {
  const rows = (round.results || []);
  const mine = rows.find(r => r.player_id === me.id);
  const top = rows.slice(0, 8).map((r, i) => `
    <tr class="${r.player_id === me.id ? 'me' : ''}">
      <td class="n">${r.place || '–'}</td>
      <td>${escapeHTML(r.name)} ${r.correct ? '✓' : '✗'}</td>
      <td class="ms">${(r.ms / 1000).toFixed(2)}s</td>
      ${shoot ? '' : `<td class="ms">${r.points || 0}</td>`}
    </tr>`).join('');
  const gf = s_last && s_last.golf;
  if (gf && gf.last && gf.last.length) {
    const wasMine = gf.last.some(s => s.player === me.id);
    // Two beats: the shot in golfing terms first, then the answers together.
    if (wasMine && !revealBeat[round.number]) {
      revealBeat[round.number] = true;
      const mine = gf.last.find(s => s.player === me.id);
      view.innerHTML = `${golfHeadHTML(gf)}<div class="verdict in"><div class="h">${escapeHTML(mine.call || '')}</div><div class="t">${escapeHTML(mine.words)}</div></div>`;
      if (window.Voice) { Voice.setHave(gf.voice_have); Voice.say(mine.tokens); }
      setTimeout(() => { shownRound = null; }, 4000);
      return;
    }
    // After the shot: the answer, kept for those still learning - the
    // question, what they tapped, and the right one, together.
    const q = round.question || {};
    const rightAt = (q.choices || []).indexOf(round.answer);
    const answers = wasMine ? `<p class="big" style="margin:.6rem 0 .4rem">${escapeHTML(q.text || '')}</p>
      <div id="choices">${(q.choices || []).map((c, i) => `<button class="choice ${i === rightAt ? 'right' : (i === myChoice ? 'wrong' : '')}" disabled>
        <span class="k">${'ABCD'[i]}</span>${escapeHTML(c)}</button>`).join('')}</div>` : '';
    view.innerHTML = `${golfPlaybackHTML(gf)}${answers}${golfHeadHTML(gf)}
      ${wasMine && !gf.over ? `<p style="padding:.6rem 0 0"><button class="choice" id="next-stroke" style="text-align:center"><b>Next stroke &rsaquo;</b></button>
        <span class="tiny muted" style="display:block;margin-top:.3rem">Read it first; the round waits for you.</span></p>` : ''}
      <p class="state" style="padding:1rem 0">${gf.over ? `<b>${escapeHTML(gf.winner_name || 'Somebody')}</b> wins the round.`
        : gf.your_turn ? 'Your stroke next.' : gf.away_name ? `${escapeHTML(gf.away_name)} is away next.` : 'Next stroke coming.'}</p>`;
    const nb = document.getElementById('next-stroke');
    if (nb) nb.addEventListener('click', async () => { nb.disabled = true; await api('/api/party/next', {}); });
    return;
  }
  view.innerHTML = `
    ${shoot ? shootVerdict(mine, shoot)
     : mine ? `<div class="verdict ${mine.correct ? 'right' : 'wrong'}">
        <div class="h">${mine.correct ? 'Correct' : 'Not this time'}</div>
        <div class="mine">${(mine.ms / 1000).toFixed(2)}s</div>
        <div class="t">${mine.correct
          ? `${ordinal(mine.place)} on this table · ${mine.points} points`
          : 'No points for this one'}</div>
      </div>`
      : `<div class="verdict wrong"><div class="h">No answer</div>
         <div class="t">You did not get one in before time</div></div>`}
    <table class="board">${top}</table>
    ${paintShootout(shoot, false)}
    ${shoot && shoot.your_pick ? paintPick(shoot)
      : (state_hall_on(s_last) ? hallPickHTML(s_last)
      : `<p class="state" style="padding:1.4rem 0">${waitingLine(shoot)}</p>`)}
    ${hallCardHTML(s_last)}`;
  wirePick();
  wireHallPick();
}

/* The hall's card, small, wherever the phone is waiting: the tick swaps it
   as the host's clock turns it over. */
function hallCardHTML(s) {
  const card = s && s.hall && s.hall.show && s.hall.show.card;
  if (!card) return '';
  return `<div class="hs-small" id="hallcard" data-card="${escapeHTML(card.id)}" style="text-align:left;margin-top:.6rem">${
    hallShow.cardHTML(card, {master: s.hall.master, small: true})}</div>`;
}

let s_last = null;                       // the last state polled, for the hall
function state_hall_on(s) { return !!(s && s.hall && s.hall.shootout && s.hall.shootout.on); }

/* ------------------------------------------------------------- shootout */
function wordHTML(row) {
  const have = row.word || '', all = 'ELMER';
  return `<span class="word ${row.out ? 'out' : ''}">${escapeHTML(have)}<i>${
    all.slice(have.length).split('').join('')}</i></span>`;
}

function nameOf(shoot, id) {
  const row = (shoot.standing || []).find(r => r.player === id);
  return row ? (row.player === me.id ? 'you' : row.name) : 'somebody';
}

/* "Bob, Hertz and you took a letter" rather than "3 took a letter": at a
   table of five the names are the news. Past four it counts the rest. */
function whoTook(shoot, took) {
  const names = took.slice(0, 4).map(id => nameOf(shoot, id));
  const more = took.length - names.length;
  let list = names.length <= 1 ? names.join('')
           : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  if (more > 0) list += ` and ${more} more`;
  return list;
}

function paintShootout(shoot, withNote) {
  if (!shoot) return '';
  const last = shoot.last || {};
  const took = (last.took || []);
  const rows = (shoot.standing || []).map(r => `
    <tr class="${r.player === me.id ? 'me' : ''} ${r.gone ? 'gone' : ''}">
      <td>${escapeHTML(r.name)}${r.picking && !shoot.over ? ' · picking' : ''}${
        r.bot ? ' <span class="took" style="color:var(--dim)">practice</span>' : ''}</td>
      <td class="w">${wordHTML(r)}</td>
    </tr>`).join('');
  let note = '';
  if (shoot.over) {
    note = shoot.drawn ? 'Out of subjects with nobody ahead: a draw.'
         : shoot.winner === me.id ? 'You win it.'
         : `${escapeHTML(shoot.winner_name || 'Somebody')} wins it.`;
  } else if (last.passed) {
    note = `${escapeHTML(nameOf(shoot, last.picker))} ran out of time, so the pick moved on. No letters.`;
  } else if (last.section) {
    const picker = escapeHTML(nameOf(shoot, last.picker));
    note = last.made
      ? (took.length ? `${picker === 'you' ? 'You' : picker} made it. ${escapeHTML(whoTook(shoot, took))} took a letter.`
                     : `${picker === 'you' ? 'You' : picker} made it, and so did everybody else.`)
      : `${picker === 'you' ? 'You' : picker} missed, so nobody takes a letter.`;
    if (last.outswum) {
      // Made it, and somebody made it a clear second sooner: the pick moves.
      const swimmer = escapeHTML(nameOf(shoot, last.outswum));
      note += ` ${swimmer === 'you' ? 'You' : swimmer} had it a second faster — pack your bags, ${picker}: maybe you can swim here, but others swim better. The pick moves.`;
    }
  }
  // The note is the table's summary; under a verdict card it would say the
  // same thing twice, so the results screen leaves it out.
  return `<div class="shoot">${note && withNote !== false ? `<p class="took">${note}</p>` : ''}
            <table>${rows}</table></div>`;
}

/* The picker's screen: the subjects left, as buttons. The judgement being
   made is "what do I know that they do not", which is a subject-level one,
   so it is subjects rather than questions - and the ones already spent are
   simply not offered, because the rule is that a subject is played once. */
function paintPick(shoot) {
  // Grouped under the subelement - "T5 · Electrical Principles" - so a
  // picker who knows they are good at electrical principles finds all six of
  // those subjects together rather than hunting a list of thirty-three.
  let group = null, out = '';
  (shoot.available || []).forEach(a => {
    if (a.group !== group) {
      group = a.group;
      out += `<h4>${escapeHTML(a.group)}${a.group_title ? ' · ' + escapeHTML(a.group_title) : ''}</h4>`;
    }
    out += `<button class="choice" data-section="${escapeHTML(a.section)}">
      <span class="k">${escapeHTML(a.section)}</span>${escapeHTML(a.title)}</button>`;
  });
  return `<div class="pick"><h3>${pickGreeting(shoot)}
      <span class="clock" id="pickleft"></span></h3>
      <p class="tiny muted" style="margin:0 0 .5rem">Choose the subject. The board picks the question.</p>${out}</div>`;
}

/* How the pick arrived is worth a different first line: one that was earned
   is a small moment and should be met as one; one that came round because
   nobody got the question is just a turn. */
function pickGreeting(shoot) {
  switch (shoot.pick_reason) {
    case 'kept':     return 'Nice one \u2014 you made it. Your pick again.';
    case 'quickest': return 'Quickest right answer. Your pick.';
    case 'outswum':  return 'You had it a clear second faster — the pick is yours.';
    case 'first':    return 'You\u2019re up first. Your pick.';
    case 'admitted': return 'You\u2019re in, and it\u2019s your pick.';
    case 'timeout':  return 'Time ran out over there. Your pick.';
    default:         return 'It comes round to you. Your pick.';
  }
}

function wirePick() {
  document.querySelectorAll('.pick .choice').forEach(b =>
    b.addEventListener('click', async () => {
      document.querySelectorAll('.pick .choice').forEach(x => { x.disabled = true; });
      b.classList.add('picked');
      try {
        const r = await api('/api/party/pick', {player: me.id, section: b.dataset.section});
        if (r.status !== 200) {
          document.querySelectorAll('.pick .choice').forEach(x => { x.disabled = false; });
          b.classList.remove('picked');
        }
      } catch (e) {
        document.querySelectorAll('.pick .choice').forEach(x => { x.disabled = false; });
        b.classList.remove('picked');
      }
    }));
}

function waitingLine(shoot) {
  if (!shoot) return 'Waiting for the next question…';
  // A finished game is not waiting for anything, and saying it is would
  // leave everybody at the table watching for a question that never comes.
  if (shoot.over) return 'The shootout is over. The table can start another.';
  if (shoot.pick) return `${escapeHTML(shoot.picker_name || 'The picker')} chose ${
    escapeHTML(shoot.pick_title || shoot.pick)}. Next question coming…`;
  return `Waiting for ${escapeHTML(shoot.picker_name || 'the picker')} to choose the subject… ` +
         `<span class="clock" id="pickleft"></span>`;
}

/* The pick's clock, refreshed each poll the way the question's is - without
   repainting the list, which would pull the buttons out from under a thumb. */
function paintPickClock(shoot) {
  const el = document.getElementById('pickleft');
  if (!el) return;
  const left = shoot && shoot.pick_remaining;
  el.textContent = (left === null || left === undefined) ? '' : Math.ceil(left) + 's';
  el.classList.toggle('urgent', left !== null && left !== undefined && left <= 10);
}

function ordinal(n) {
  if (!n) return '';
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function escapeHTML(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

/* ------------------------------------------------------------------ poll */
async function tick() {
  let r;
  try {
    r = await api('/api/party/state?player=' + me.id);
  } catch (e) { return; }
  if (r.status === 404) { clearInterval(poll); showJoin('The party has ended.'); return; }
  const s = r.data, round = s.addressing ? null : s.round, shoot = s.shootout;
  // The unit has been updated underneath this page: fetch the new one. The
  // player is kept in sessionStorage, so the reload lands back in the game.
  if (s.build && s.build !== PAGE_BUILD) { location.reload(); return; }
  s_last = s;
  // Named for the course while golf is the game, as the table is.
  const courseName = (s.golf && s.golf.course_name) || (s.clubhouse && s.clubhouse.course_name) ||
                     (s.standing && s.standing.mode === 'golf' && s.standing.course_name) || '';
  const shortName = courseName ? courseName.replace(' Golf Links', '').replace(' Golf Club', '').replace(' National', '') : '';
  const wantTitle = (shortName || PAGE_TABLE_NAME) + ' · ELMER';
  if (document.title !== wantTitle) document.title = wantTitle;
  const hall = s.hall && s.hall.shootout;
  const show = s.hall && s.hall.show;
  // Cadence: fast while a round is up or its run-up is counting, easy in the
  // waiting room. A shootout waiting on a pick is still the game, so stay fast.
  pollMs = ((round && !round.closed) || (show && show.lead_in)
            || (shoot && !shoot.over) || (s.golf && !s.golf.over)) ? POLL_FAST : POLL_WAIT;
  if (window.Warm && (s.clubhouse || (s.golf && !s.golf.over))) {
    Warm.round();
    if (s.golf) Warm.warm([s.golf.next_figure, s.golf.next_tee_pic]);
  }
  hallShow.overlay(show);
  // The card changes on the host's clock, not the round's: swap it in place.
  const cardBox = document.getElementById('hallcard');
  if (cardBox && show && show.card && cardBox.dataset.card !== String(show.card.id)) {
    cardBox.dataset.card = show.card.id;
    cardBox.innerHTML = hallShow.cardHTML(show.card, {master: s.hall.master, small: true});
  }
  // The pick is part of what is on screen, so a change in whose it is - or
  // in whether it has been made - repaints, even with no new round.
  const pickKey = (shoot ? ('|' + (shoot.picker || '') + (shoot.pick || '') + (shoot.over ? 'over' : '')) : '') +
                  (hall ? ('|h' + (hall.picker || '') + (hall.pick || '') + (hall.your_pick ? 'mine' : '') + (hall.over ? 'over' : '')) : '') +
                  // Golf between strokes: whose address it is, and whether it
                  // waits on this phone's Hit, are part of what is on screen.
                  (s.golf ? ('|g' + (s.golf.away == null ? '' : s.golf.away) + (s.golf.last || []).length +
                             (s.golf.address_waits ? 'w' : '') + (s.golf.hole || '') + (s.golf.over ? 'over' : '')) : '') +
                  (s.clubhouse ? ('|c' + s.clubhouse.people.length + Math.ceil((s.clubhouse.tee_in || 0) / 5)) : '');


  if (!round) {
    // A card that arrived after the waiting screen was painted - the host
    // turned the deck on, or this phone joined a beat before the show
    // reached its table - gets the screen repainted, once.
    const soon = s.starts_in !== null && s.starts_in !== undefined;
    const needCard = show && show.card && !soon && !document.getElementById('hallcard');
    if (shownRound !== 'none' + pickKey || needCard) { shownRound = 'none' + pickKey; paintWaiting(s); }
    paintPickClock(shoot);
    paintHallPickClock(s);
    return;
  }

  currentRound = round;
  if (round.question && round.question.difficulty) {
    document.getElementById('roommark').dataset.class = round.question.difficulty;
  }
  if (round.closed) {
    // The beat before the placings, timed from when this phone first saw
    // the round closed - not from a server clock, which is the tournament's
    // business and not the phone's.
    if (closedSeenAt === null || closedSeenAt.round !== round.number) {
      closedSeenAt = {round: round.number, at: performance.now()};
    }
    if (performance.now() - closedSeenAt.at < SCORING_MS) {
      if (shownRound !== 'scoring-' + round.number) {
        shownRound = 'scoring-' + round.number;
        paintScoring();
      }
      return;
    }
    if (shownRound !== 'closed-' + round.number + pickKey) {
      shownRound = 'closed-' + round.number + pickKey;
      paintResults(round, shoot);
    }
    paintPickClock(shoot);
    paintHallPickClock(s);
    return;
  }
  if (shownRound !== round.number) {
    shownRound = round.number;
    paintQuestion(round, s.cutthroat, s.golf);
  }
  // Answered, and the clock is nearly out: the scoring beat starts early so
  // it does not cut into the reveal, and the card gives way to it. Not in
  // golf, where nothing is on a clock.
  if (answered && !s.golf && round.remaining <= SCORING_MS / 1000) {
    if (shownRound !== 'scoring-' + round.number) {
      shownRound = 'scoring-' + round.number;
      paintScoring();
    }
    return;
  }
  const left = document.getElementById('left');
  if (left) {
    left.textContent = Math.ceil(round.remaining) + 's';
    left.classList.toggle('urgent', round.remaining <= 10);
  }
}

/* Fast while a question or its run-up is on the screen, easy between rounds.
   Nobody watching an intermission board that turns every 15 s notices a 5 s
   refresh, and it takes seven in eight of a phone's requests off the wifi -
   which is what a room full of phones actually strains, not the pipe. */
const POLL_FAST = 1000, POLL_WAIT = 5000;
let pollMs = POLL_FAST;
/* Every poll is caught and the next always armed - a tick that threw used
   to end the polling for good, and a phone with nothing wrong on it sat on
   its last screen. A failed or slow poll is reported to the server log. */
let lastGoodPoll = performance.now();
async function guardedTick() {
  const t0 = performance.now();
  try {
    await tick();
    lastGoodPoll = performance.now();
    if (performance.now() - t0 > 4000) reportError('slow-poll', 'the phone state took ' + Math.round(performance.now() - t0) + ' ms');
  } catch (err) {
    reportError('poll-failed', 'phone tick failed: ' + (err && err.message ? err.message : err), {stack: err && err.stack});
  }
}
function schedulePoll() {
  if (poll) clearTimeout(poll);
  poll = setTimeout(async () => { await guardedTick(); schedulePoll(); }, pollMs);
}
setInterval(() => {
  if (poll && performance.now() - lastGoodPoll > 30000) {
    reportError('poll-stalled', 'no phone state in ' + Math.round((performance.now() - lastGoodPoll) / 1000) + ' s; polling again');
    lastGoodPoll = performance.now();
    schedulePoll();
  }
}, 10000);
function start() {
  if (poll) clearTimeout(poll);
  tick();
  schedulePoll();
}

/* The games, in words, for whoever was invited: the one the table is set
   for first, open; the others folded under it. */
function gamesGuideHTML(chosen) {
  const order = [chosen].concat(Object.keys(GAME_NAMES).filter(m => m !== chosen));
  return `<h3 style="margin:.9rem 0 .3rem">The games here</h3>` + order.map(m => {
    const a = GAME_ABOUT[m]; if (!a) return '';
    return `<details ${m === chosen ? 'open' : ''} style="margin:.3rem 0"><summary><b>${escapeHTML(GAME_NAMES[m])}</b>${m === chosen ? ' <span class="clock">this table</span>' : ''}</summary>
      <p class="small" style="margin:.3rem 0">${a.how}</p><p class="tiny muted" style="margin:0 0 .4rem">${a.progress}</p></details>`;
  }).join('');
}

/* ---------------------------------------------------------- CW Baseball */
/* Batting: the pitch sounds here too, in the batter's ear; they type what
   they copied and swing. Fielding: a touch key - hold the big button - and
   the decoder in morse.js reads what was keyed; Throw sends it. */
const phonePlayer = (typeof CWPlayer === 'function') ? new CWPlayer() : null;
let phonePitched = null, phoneKey = null;
function paintBaseballPhone(b) {
  if (b.phase === 'pitch' && b.pitch && b.pitch.n !== phonePitched && phonePlayer && (b.your_swing || b.your_team === b.batting)) {
    phonePitched = b.pitch.n;
    try { phonePlayer.send(b.pitch.groups, b.pitch.timing, null, () => {}); } catch (e) {}
  }
  if (b.phase !== 'field') phoneKey = null;
  const key = 'ball' + b.phase + (b.pitch ? b.pitch.n : '') + b.outs + b.strikes + (b.last ? b.last.n + (b.last.result || '') : '') + (b.your_swing ? 's' : '') + (b.your_throw ? 't' : '');
  if (shownRound === key) { const dl = document.getElementById('ball-clock'); if (dl) dl.textContent = Math.ceil(b.deadline_in) + 's'; return; }
  shownRound = key;
  const score = `<p class="clock" style="margin:0 0 .4rem">CW Baseball &middot; ${b.over ? 'final' : (b.half + ' ' + ordinal(b.inning))} &middot; A ${b.runs.A} &ndash; B ${b.runs.B} &middot; ${b.outs} out &middot; you are Side ${b.your_team || '?'}</p>`;
  let main = '';
  if (b.over) main = `<h2>Side ${b.winner} wins, ${b.runs.A} to ${b.runs.B}.</h2>`;
  else if (b.phase === 'between') main = `<p>${b.half === 'top' ? 'Top' : 'Bottom'} of the ${ordinal(b.inning)}. Side ${b.batting} bats. The pitch is ${escapeHTML(b.level)} at ${b.wpm} wpm.</p>`;
  else if (b.phase === 'pitch') {
    main = b.your_swing
      ? `<p><b>You're up.</b> ${b.pitch && b.pitch.kind === 'contact' ? 'Somebody is calling CQ: copy their call and swing.' : 'Copy the pitch and swing.'} <span id="ball-clock">${Math.ceil(b.deadline_in)}s</span></p>
         <input id="ball-typed" class="cw-input" style="width:100%;font-family:var(--mono);font-size:1.2rem;padding:.6rem" autocomplete="off" autocapitalize="characters" placeholder="what you copied">
         <p><button class="choice" id="ball-swing" style="text-align:center"><b>Swing &rsaquo;</b></button></p>`
      : `<p><b>${escapeHTML(b.batter_name)}</b> at bat. The pitch is ${escapeHTML(b.level)}, ${b.wpm} wpm${b.pitch && b.pitch.kind === 'contact' ? ' - somebody is calling CQ' : ''}. Copy along.</p>`;
  } else if (b.phase === 'field') {
    main = b.your_throw
      ? `<p><b>Your ball.</b> ${b.pitch.kind === 'contact' ? 'Answer the call:' : 'Key back'} <span class="mono">${escapeHTML(b.pitch.key || b.pitch.plain)}</span> and throw. <span id="ball-clock">${Math.ceil(b.deadline_in)}s</span></p>
         <button class="choice" id="ball-key" style="height:6rem;font-size:1.2rem;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none">hold to key</button>
         <p class="mono" id="ball-keyed" style="min-height:1.4rem">&nbsp;</p>
         <p><button class="choice" id="ball-throw" style="text-align:center"><b>Throw &rsaquo;</b></button></p>`
      : `<p>In play - <b>${escapeHTML(b.fielder_name)}</b> keys it back.</p>`;
  } else {
    main = `<p>${escapeHTML((b.last && b.last.words) || '')}</p>` +
      (b.last && b.last.pitch ? `<p class="tiny muted">The pitch was <span class="mono">${escapeHTML(b.last.pitch)}</span>${b.last.typed !== undefined ? ' · copied as <span class="mono">' + escapeHTML(b.last.typed || '·') + '</span>' : ''}</p>` : '');
  }
  view.innerHTML = `<div class="state" style="padding:1rem .2rem;text-align:left">${score}${main}
    <p class="tiny muted" style="margin-top:.8rem">Bases: ${(b.bases || []).map((x, i) => x ? ordinal(i + 1) + ' ' + escapeHTML(x.name) : '').filter(Boolean).join(', ') || 'empty'}</p></div>`;
  const sw = document.getElementById('ball-swing');
  if (sw) {
    const inp = document.getElementById('ball-typed');
    inp.focus();
    const go = async () => { sw.disabled = true; await api('/api/party/ball/swing', {player: me.id, typed: inp.value}); shownRound = null; tick(); };
    sw.addEventListener('click', go);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }
  const kb = document.getElementById('ball-key');
  if (kb) {
    phoneKey = {decoder: new MorseDecoder(null), down: false, downAt: 0, lastUp: 0};
    const down = e => { e.preventDefault(); if (phoneKey.down) return; phoneKey.down = true; const now = performance.now();
      if (phoneKey.lastUp) phoneKey.decoder.space(now - phoneKey.lastUp); phoneKey.downAt = now; if (phonePlayer) phonePlayer.down(); kb.classList.add('picked'); };
    const up = e => { e.preventDefault(); if (!phoneKey.down) return; phoneKey.down = false; const now = performance.now();
      phoneKey.decoder.mark(now - phoneKey.downAt); phoneKey.lastUp = now; if (phonePlayer) phonePlayer.up(); kb.classList.remove('picked');
      document.getElementById('ball-keyed').textContent = phoneKey.decoder.text + phoneKey.decoder.symbols.join(''); };
    kb.addEventListener('pointerdown', down); kb.addEventListener('pointerup', up); kb.addEventListener('pointercancel', up); kb.addEventListener('pointerleave', up);
    document.getElementById('ball-throw').addEventListener('click', async () => {
      phoneKey.decoder.flush();
      await api('/api/party/ball/field', {player: me.id, keyed: phoneKey.decoder.text});
      phoneKey = null; shownRound = null; tick();
    });
  }
}

/* A tap on the strip is the golfer's mark: the point turned into yards
   along the hole and off the line with the geometry the state carries. */
document.addEventListener('click', async e => {
  const clear = e.target.closest('#aim-clear');
  if (clear) {
    e.preventDefault();
    await api('/api/party/aim', {player: me.id, clear: true});
    shownRound = null; tick();
    return;
  }
  const strip = e.target.closest('img[data-aim-for]');
  if (!strip || !s_last || !s_last.golf || !s_last.golf.map) return;
  const geo = s_last.golf.map;
  const r = strip.getBoundingClientRect();
  const x = (e.clientX - r.left) * geo.w / r.width;
  const y = (e.clientY - r.top) * geo.h / r.height;
  let at, off;
  if (geo.view === 'green') {
    const along = (geo.cy - y) / geo.px_per_ft, across = (x - geo.cx) / geo.px_per_ft;
    at = Math.round((geo.yards + along / 3) * 100) / 100; off = Math.round(across / 3 * 100) / 100;
  } else {
    const usable = geo.h - geo.pad_top - geo.pad_bot;
    at = Math.round((geo.h - geo.pad_bot - y) / usable * geo.yards);
    const b = geo.bend;
    const centre = (b && at > b.at) ? geo.centre + b.dir * Math.min(b.most, (at - b.at) * b.k) : geo.centre;
    off = Math.round((x - centre) / geo.px_per_yard);
  }
  await api('/api/party/aim', {player: me.id, at, off});
  shownRound = null; tick();
});

/* A phone that locks and comes back should not sit on a stale question. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && me) tick();
});

const leaveBtn = document.getElementById('leave');
leaveBtn.addEventListener('click', async () => {
  if (!confirm('Leave the table?')) return;
  if (poll) clearInterval(poll);
  try { await api('/api/party/leave', {player: me.id}); } catch (e) { /* going anyway */ }
  sessionStorage.removeItem('elmer_party_player');
  me = null; shownRound = null;
  who.textContent = '';
  leaveBtn.hidden = true;
  showJoin(null);
});

const remembered = sessionStorage.getItem('elmer_party_player');
if (remembered) {
  me = JSON.parse(remembered);
  who.textContent = me.name + ' · Cohort ' + me.cohort;
  leaveBtn.hidden = false;
  start();
} else {
  showJoin(null);
}
